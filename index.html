<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songtool">
<meta name="theme-color" content="#1b1a17">
<title>Songtool</title>
<style>
:root{
  --bg:#1b1a17; --panel:#242220; --panel2:#2c2a26; --ink:#f2ede4; --dim:#b9b2a4; --accent:#d99b3f;
  --accent2:#7fa694; --line:#3a372f; --muse:#8a6fae; --fout:#e06c6c; --ok:#7fa694;
  --mono: Menlo, 'Courier New', Consolas, monospace; --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --vh: 100vh; --top: max(env(safe-area-inset-top, 0px), var(--top-safari, 0px)); --bot: env(safe-area-inset-bottom, 0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
body{ font-family:var(--sans); font-size:16px; }
button{ font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 12px; cursor:pointer; }
button:active{ border-color:var(--accent); }
button.primair{ background:var(--accent); color:#1b1a17; border-color:var(--accent); font-weight:600; }
button.gevaar{ color:var(--fout); }
button.plat{ background:none; border:none; padding:6px 8px; }
input,textarea,select{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%; }
input:focus,textarea:focus{ outline:none; border-color:var(--accent); }
.verborgen{ display:none !important; }
.zacht{ color:var(--dim); }
.klein{ font-size:13px; }

/* ---------- app-raamwerk: past altijd in het zichtbare deel (ook met toetsenbord open) ---------- */
#app{ position:fixed; left:0; right:0; top:0; height:var(--vh); display:flex; flex-direction:column; }
.kop{ flex:none; display:flex; align-items:center; gap:4px; padding:calc(6px + var(--top)) 8px 6px; background:var(--panel); border-bottom:1px solid var(--line); min-height:52px; }
.ib{ flex:none; width:42px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; font-size:20px; background:none; border:none; border-radius:10px; }
.ib:active{ background:var(--panel2); }
.titelknop{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:2px 6px; }
.titelknop .t{ display:block; font-family:var(--serif); font-size:18px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titelknop .m{ display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.modus{ flex:none; height:36px; padding:0 12px; border-radius:18px; font-size:14px; }
.modus.aan{ background:var(--accent); color:#1b1a17; border-color:var(--accent); }
.dot{ flex:none; width:10px; height:10px; border-radius:50%; background:#5b574e; margin:0 4px; }
.dot.ok{ background:var(--ok); } .dot.bezig{ background:var(--accent); } .dot.fout{ background:var(--fout); }

.balk{ flex:none; display:flex; gap:6px; align-items:center; padding:6px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--line); background:var(--bg); scrollbar-width:none; }
.balk::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:6px 11px; border-radius:16px; font-family:var(--mono); font-size:14px; background:var(--panel2); }
.chip.sectie{ font-family:var(--sans); }
.chip.acc{ color:var(--accent); }
.balk input{ flex:none; width:110px; padding:6px 10px; border-radius:16px; }

main{ flex:1; min-height:0; position:relative; }
#editor{ position:absolute; inset:0; width:100%; height:100%; border:none; border-radius:0; resize:none; padding:14px 14px calc(30px + var(--bot)); font-family:var(--mono); font-size:16px; line-height:1.55; background:var(--bg); -webkit-overflow-scrolling:touch; }
#weergave{ position:absolute; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(40px + var(--bot)); }
.leeg{ padding:40px 24px; text-align:center; color:var(--dim); line-height:1.6; }
.leeg button{ margin:6px; }

/* ---------- weergave (akkoorden boven de lettergreep, ook als de regel omloopt) ---------- */
.blad{ font-family:var(--serif); font-size:calc(17px * var(--schaal, 1)); line-height:1.25; max-width:760px; margin:0 auto; }
.info{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:16px; background:var(--panel); }
.info .t{ font-size:1.25em; color:var(--accent); }
.info .r{ font-family:var(--sans); font-size:13px; color:var(--dim); margin-top:4px; }
.sectie-kop{ font-family:var(--sans); font-weight:700; font-size:.78em; letter-spacing:.06em; text-transform:uppercase; color:var(--accent2); margin:18px 0 6px; }
.notitie{ font-style:italic; color:var(--dim); font-size:.9em; margin:4px 0 2px; }
.lijn{ margin:0 0 6px; }
.sg{ display:inline-block; vertical-align:bottom; white-space:pre; }
.sg .c{ display:block; font-family:var(--mono); font-weight:700; color:var(--accent); font-size:.82em; min-height:1.2em; padding-right:.35em; }
.lijn.zonder .sg .c{ display:none; }
.akkoordlijn{ font-family:var(--mono); font-weight:700; color:var(--accent); font-size:.85em; margin:2px 0 8px; white-space:pre-wrap; }
.wit{ height:.7em; }


.toon{ flex:none; min-width:44px; text-align:center; font-family:var(--mono); font-weight:700; color:var(--ink); }
.toon.acc{ color:var(--accent); }
.chip.aan{ background:var(--accent); color:#1b1a17; border-color:var(--accent); }
#weergave.passend{ overflow:hidden; padding:12px 16px; }
#weergave.passend .blad{ max-width:none; column-gap:36px; column-rule:1px solid var(--line); }
#weergave.passend .info{ column-span:all; margin-bottom:10px; padding:6px 10px; }
.blok{ break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; }
.tabs{ display:flex; gap:6px; padding:8px 10px 0; }
.tab{ flex:1; padding:7px 8px; font-size:14px; border-radius:9px 9px 0 0; border-bottom:none; background:var(--bg); color:var(--dim); }
.tab.aan{ background:var(--panel2); color:var(--ink); }
.badge-dot{ position:relative; }
.badge-dot::after{ content:''; position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
.bspeler{ flex:none; background:var(--panel); border-top:1px solid var(--line); padding:6px 8px calc(6px + var(--bot)); }
.brij{ display:flex; gap:6px; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.brij::-webkit-scrollbar{ display:none; }
.brij + .brij{ margin-top:6px; }
.bronnen{ display:flex; gap:6px; flex:none; }
.speel{ flex:none; width:46px; height:46px; border-radius:50%; background:var(--accent); color:#1b1a17; border:none; font-size:18px; font-weight:700; }
.btijd{ flex:none; font-family:var(--mono); font-size:12px; color:var(--dim); margin-left:auto; padding-left:6px; }
.maten{ max-width:900px; margin:0 auto; }
.maat-sectie{ margin-bottom:14px; }
.maat-rij{ display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:4px; }
.maat{ position:relative; border:1px solid var(--line); border-radius:8px; padding:16px 6px 8px; min-height:52px; font-family:var(--mono); font-weight:700; color:var(--accent); font-size:15px; text-align:center; cursor:pointer; }
.maat .nr{ position:absolute; top:3px; left:6px; font-size:10px; font-weight:400; color:var(--dim); }
.maat.nu{ background:var(--accent); color:#1b1a17; }
.maat.nu .nr{ color:#1b1a17; }
.mijn-sound{ max-width:760px; margin:0 auto 8px; padding:8px 12px; border-radius:10px; background:#203038; color:#bfe0ee; white-space:pre-wrap; font-size:15px; cursor:pointer; }
.run{ font-family:var(--sans); font-style:italic; font-size:.8em; color:#9fd0e8; margin:-2px 0 8px 10px; }
.tikbaar{ cursor:pointer; outline:1px dashed #4a7a90; outline-offset:2px; border-radius:4px; }
.maat.met-run{ border-color:#4a7a90; }
.run-maat{ display:block; font-family:var(--sans); font-weight:400; font-style:italic; font-size:11px; color:#9fd0e8; margin-top:3px; line-height:1.2; }
.maat.nu .run-maat{ color:#1b1a17; }
.mijn-notitie{ max-width:760px; margin:0 auto 12px; padding:10px 12px; border-radius:10px; background:#3a3320; color:#f0dca8; white-space:pre-wrap; font-size:15px; line-height:1.4; cursor:pointer; }
.frag.nieuw{ border-color:var(--accent); }
.aan-gedeeld{ color:var(--ok); border-color:var(--ok); }
/* ---------- lades (bibliotheek links, fragmenten rechts) ---------- */
.scherm{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; }
.lade{ position:fixed; top:0; bottom:0; width:min(92vw, 400px); background:var(--panel); z-index:21; display:flex; flex-direction:column; transition:transform .2s ease; padding-top:var(--top); }
.lade.links{ left:0; transform:translateX(-102%); border-right:1px solid var(--line); }
.lade.rechts{ right:0; transform:translateX(102%); border-left:1px solid var(--line); }
.lade.open{ transform:none; }
.lade-kop{ flex:none; display:flex; align-items:center; gap:6px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--line); }
.lade-kop b{ flex:1; font-family:var(--serif); font-size:18px; color:var(--accent); }
.lade-zoek{ flex:none; padding:8px 10px; border-bottom:1px solid var(--line); }
.lade-lijst{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:4px 0 20px; }
.lade-voet{ flex:none; display:flex; gap:8px; padding:8px 10px calc(8px + var(--bot)); border-top:1px solid var(--line); }
.lade-voet button{ flex:1; }
.album{ margin:6px 0 2px; }
.album-kop{ display:flex; align-items:center; padding:8px 6px 4px 14px; }
.album-kop .n{ flex:1; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
.nummer{ display:flex; align-items:center; gap:4px; padding:0 6px 0 14px; min-height:48px; border-left:3px solid transparent; }
.nummer.actief{ background:var(--panel2); border-left-color:var(--accent); }
.nummer .tt{ flex:1; min-width:0; padding:6px 0; }
.nummer .tt span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nummer .tt .mm{ font-size:12px; color:var(--dim); }
.nummer .ord{ display:flex; gap:2px; }
.nummer .ord button{ width:36px; height:34px; padding:0; }
.studio-teken{ font-size:12px; color:var(--accent2); margin-left:4px; }
@media (min-width: 1000px){
  /* breed scherm: bibliotheek blijft naast de tekst staan */
  body.vast-lib .lade.links{ transform:none; position:fixed; width:320px; }
  body.vast-lib #app{ left:320px; }
  body.vast-lib #scherm-lib{ display:none !important; }
}

.frag{ margin:8px 10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.frag .tx{ white-space:pre-wrap; font-family:var(--serif); line-height:1.4; }
.frag .tg{ margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
.pil{ font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--dim); }
.pil.type{ color:var(--accent); } .pil.sfeer{ color:var(--muse); } .pil.stanza{ color:var(--accent2); }
.frag .ac{ display:flex; gap:6px; margin-top:8px; }
.memo{ margin:6px 0 2px; }
.memo .mini-blad{ max-height:none; background:var(--panel); }
.memo .blad{ font-size:15px; }
.melodie{ font-family:var(--mono); font-size:13px; color:var(--accent2); margin:6px 0; line-height:1.6; }
.frag .ac button{ padding:6px 10px; font-size:14px; }
.filters{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); }
.filters .chip{ font-family:var(--sans); font-size:13px; padding:4px 10px; }
.filters .chip.aan{ background:var(--accent); color:#1b1a17; }
.muze-keus{ padding:0 0 8px; border:none; }
.veld.muze-notities{ margin-top:18px; }
.muze-notities textarea{ font-size:15px; line-height:1.45; }

/* ---------- blad onderaan (menu, songinfo, studio, sync, ...) ---------- */
.vel{ position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; max-height:calc(var(--vh) - var(--top) - 24px); display:flex; flex-direction:column; transform:translateY(105%); transition:transform .2s ease; }
.vel.open{ transform:none; }
@media (min-width: 700px){ .vel{ left:50%; right:auto; width:620px; margin-left:-310px; } }
.vel-kop{ flex:none; display:flex; align-items:center; padding:10px 8px 8px 16px; border-bottom:1px solid var(--line); }
.vel-kop b{ flex:1; font-size:17px; }
.vel-inhoud{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:12px 16px calc(18px + var(--bot)); }
#scherm-vel{ z-index:30; }
.menu-item{ display:flex; width:100%; align-items:center; gap:12px; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:14px 4px; }
.menu-item:last-child{ border-bottom:none; }
.menu-item .i{ width:26px; text-align:center; font-size:19px; }
.menu-item .u{ display:block; font-size:12px; color:var(--dim); }
.veld{ display:block; margin:0 0 12px; }
.veld > span{ display:block; font-size:13px; color:var(--dim); margin-bottom:4px; }
.rij{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.rij > *{ flex:1; }
.knoppen{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.melding{ padding:10px 12px; border-radius:10px; background:var(--panel2); margin:0 0 12px; line-height:1.45; font-size:14px; }
.melding.fout{ color:#f3b3b3; background:#3d2424; }
.statuschips{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.sc{ font-size:12px; padding:3px 9px; border-radius:10px; background:var(--panel2); color:var(--dim); }
.sc.klaar{ color:var(--ok); } .sc.oud{ color:var(--accent); }
.studio-versie{ border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 14px; background:var(--bg); }
.studio-versie h3{ margin:0 0 2px; font-size:16px; }
.mini-blad{ max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:10px; margin:8px 0; font-size:14px; }
audio{ width:100%; margin-top:8px; }
.toast{ position:fixed; left:50%; bottom:calc(24px + var(--bot)); transform:translateX(-50%); background:#000c; color:#fff; padding:10px 16px; border-radius:20px; z-index:50; font-size:14px; pointer-events:none; max-width:90vw; text-align:center; }
.help code{ font-family:var(--mono); color:var(--accent); }
.help p{ margin:0 0 10px; line-height:1.5; font-size:14px; }

/* ---------- hoofddelen: Fragments, Writing, Studio ---------- */
.ib[disabled]{ opacity:.3; }
#stapvak{ position:absolute; inset:0; z-index:2; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:12px; padding:14px max(16px, calc((100% - 560px) / 2)) calc(16px + var(--bot)); }
#stapvak > *{ flex:none; }
.stappenbalk{ flex:none; display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--line); }
.stappenbalk button{ flex:1; min-width:0; padding:0 0 2px; background:none; border:none; border-radius:0; font-size:10px; color:var(--dim); display:flex; flex-direction:column; gap:4px; align-items:center; overflow:hidden; }
.stappenbalk i{ display:block; width:100%; height:4px; border-radius:2px; background:var(--line); }
.stappenbalk .klaar i{ background:var(--accent2); }
.stappenbalk .nu i{ background:var(--accent); }
.stappenbalk .nu{ color:var(--accent); font-weight:600; }
.stapvoet{ flex:none; display:flex; gap:8px; padding:8px max(12px, calc((100% - 560px) / 2)) calc(8px + var(--bot)); background:var(--panel); border-top:1px solid var(--line); }
.stapvoet > *{ min-height:44px; }
.stapvoet .primair{ flex:1; }
.stapvoet button:not(.primair):not(.d-nav){ flex:1; }
.d-nav{ flex:none; width:48px; padding:0; font-size:18px; }
.d-nav[disabled]{ opacity:.3; }
body.typt .stapvoet, body.typt .stappenbalk{ display:none; }
.d-vraag{ font-family:var(--serif); font-weight:400; font-size:21px; line-height:1.25; margin:0; }
.d-groei{ flex:1; min-width:0; }
.d-kort{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.d-acc{ color:var(--accent); }
.d-ok{ color:var(--ok); }
.d-leeg{ text-align:center; padding:24px 8px; }
.d-album{ font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent2); margin:6px 0 4px; }
.d-lijst{ display:flex; flex-direction:column; border-top:1px solid var(--line); }
.d-rij{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); min-height:48px; }
.d-rij.d-los{ border:none; padding:0; min-height:0; }
.d-rijknop{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:10px 0; min-height:50px; }
.d-rijknop .d-groei > span{ display:block; }
.d-plat{ background:none; border:none; padding:2px 0; text-align:left; }
.d-klein{ flex:none; min-width:40px; min-height:40px; padding:0; }
.d-klein[disabled]{ opacity:.3; }
.d-badge{ flex:none; font-size:11px; border:1px solid var(--line); border-radius:10px; padding:1px 7px; color:var(--dim); white-space:nowrap; }
.d-badge.ok{ color:var(--ok); border-color:var(--ok); }
.d-badge.nu{ color:var(--accent); border-color:var(--accent); }
.d-delen{ display:flex; flex-direction:column; gap:10px; position:relative; }
.d-delen::before{ content:""; position:absolute; left:17px; top:24px; bottom:24px; width:2px; background:var(--line); }
.d-deel{ position:relative; display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 12px; }
.d-deel .d-bol{ flex:none; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--panel); }
.d-deel b{ display:block; font-family:var(--serif); font-weight:400; font-size:22px; }
.d-deel .klein{ display:block; }
.d-verder{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:1px solid var(--accent); border-radius:12px; padding:12px; }
.d-verder .d-groei > *{ display:block; }
.d-seg{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.d-seg button{ flex:1; border:none; border-radius:0; background:none; min-height:42px; padding:6px 4px; font-size:14px; }
.d-seg button + button{ border-left:1px solid var(--line); }
.d-seg button.aan{ background:var(--accent); color:#1b1a17; font-weight:600; }
.d-tempo{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.d-tempo b{ font-size:30px; font-weight:600; min-width:2.3ch; text-align:center; line-height:1; font-variant-numeric:tabular-nums; }
.d-kn{ width:44px; height:44px; padding:0; font-size:20px; }
.d-kader{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.d-kader audio{ width:100%; }
.d-tekst{ white-space:pre-wrap; font-family:var(--serif); line-height:1.4; }
.d-veld{ margin:0; }
.d-sugg{ align-self:flex-start; background:none; color:var(--muse); border-color:var(--line); border-radius:16px; padding:5px 11px; font-size:13px; }
.d-knoplink{ flex:1; display:flex; align-items:center; justify-content:center; text-align:center; border:1px solid var(--line); border-radius:9px; background:var(--panel2); color:var(--ink); text-decoration:none; font-size:14px; padding:6px 10px; }
.d-melodie{ display:flex; flex-direction:column; gap:6px; padding:8px 0; border-bottom:1px solid var(--line); }
.d-rij.d-los.rij > *{ flex:none; }
.rij.d-los > *{ flex:none; }
.toast-knop{ pointer-events:auto; background:none; border:none; color:var(--accent); font-weight:700; padding:2px 0 2px 12px; text-decoration:underline; }
.toast{ bottom:calc(72px + var(--bot)) !important; }
body.bandmodus .toast{ bottom:calc(24px + var(--bot)) !important; }
@media (max-width: 360px){ .modus{ padding:0 8px; font-size:12px; } }
#printvak{ display:none; }
@media print{
  html,body{ overflow:visible; height:auto; background:#fff; color:#000; }
  #app,.lade,.scherm,.vel,.toast{ display:none !important; }
  #printvak{ display:block; }
  .blad{ font-size:12.5pt; max-width:none; }

}

<script>
'use strict';
/* =====================================================================
   Songtool — tekst, akkoorden, fragmenten; live tussen toestellen via Dropbox;
   samen met Songtool Studio (opnames, mix, drums) op de laptop.
   Gewone JavaScript zonder bouwstap, getest voor Safari 15 (iPad Air 2).
   ===================================================================== */

// Dropbox-app (PKCE, geen geheim nodig). Ingevuld na het aanmaken van de app; kan ook per toestel in 'Synchronisatie'.
var DROPBOX_APP_KEY = 'elals0a8q81c5l1';

// Rol: 'vol' (Tom) of 'band' (bandlid, bv. Robbe: enkel lezen, eigen notities en opnames).
// Een uitnodigingslink (…/Songtool/?band#uitnodiging=…) zet dit toestel in bandmodus; ?volledig zet het terug.
var ROL = (function(){
  var z = location.search + location.hash, r = null;
  try {
    if (/[?&]band(&|#|$)/.test(location.search) || /uitnodiging=/.test(location.hash)) localStorage.setItem('songtool_rol', 'band');
    if (/[?&]volledig(&|#|$)/.test(location.search)) localStorage.setItem('songtool_rol', 'vol');
    r = localStorage.getItem('songtool_rol');
  } catch (e) { r = /[?&]band/.test(z) ? 'band' : null; }
  return r === 'band' ? 'band' : 'vol';
})();

var LIB_KEY = 'songtool_library_v1', FRAG_KEY = 'songtool_fragments_v1', META_KEY = 'songtool_meta_v2',
    AUTH_KEY = 'songtool_dropbox_v1', STUDIO_KEY = 'songtool_studio_v1', UI_KEY = 'songtool_ui_v1', MEMO_KEY = 'songtool_memos_v1';
var SECTIES = ['Intro', 'Verse', 'Pre-chorus', 'Chorus', 'Refrain', 'Bridge', 'Solo', 'Intermezzo', 'Ref-riff', 'Outro'];

// Safari op een recente iPhone legt de pagina onder de statusbalk, terwijl de veilige zone 0 blijft: de kopbalk zou
// dan onbereikbaar zijn. In de app op het beginscherm geeft iOS de veilige zone wel door.
function opIphoneSafari(ua, los){ var m = /iPhone/.test(ua) && !los && /Version\/(\d+)/.exec(ua); return !!m && parseInt(m[1], 10) >= 26; }
if (opIphoneSafari(navigator.userAgent, navigator.standalone)) document.documentElement.style.setProperty('--top-safari', '50px');
function inSafariOpIos(){ return /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone; }

// ---------- hulpjes ----------
function $(id){ return document.getElementById(id); }
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'tekst') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'klasse') e.className = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (kids || []).forEach(function(c){ if (c !== null && c !== undefined && c !== false) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function genId(p){ return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function norm(s){ return String(s || '').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,''); }
function lsGet(k, fallback){ try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fallback; } catch (e) { return fallback; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
var toastTimer = null;
function toast(t){
  var d = document.querySelector('.toast'); if (d) d.remove();
  d = el('div', { klasse: 'toast', tekst: t }); document.body.appendChild(d);
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ d.remove(); }, 2600);
}
function vandaag(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function wanneer(ms){
  if (!ms) return 'nooit';
  var s = Math.round((Date.now() - ms) / 1000);
  if (s < 10) return 'zonet'; if (s < 60) return s + ' s geleden'; if (s < 3600) return Math.round(s/60) + ' min geleden';
  return new Date(ms).toLocaleString('nl-BE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

// ---------- gegevens ----------
// db = { albums:[{id,name,songIds,updated}], songs:{id:{id,title,key,bpm,lyrics,updated,versies}}, fragments:[...],
//        deleted:{id:ms}, albumsOrderAt:ms }   (zelfde vorm als vroeger, met tijdstempels erbij)
var db, meta, ui;
function laadDb(){
  var lib = lsGet(LIB_KEY, null), fr = lsGet(FRAG_KEY, null);
  var d = (lib && Array.isArray(lib.albums) && lib.songs && typeof lib.songs === 'object') ? lib : { albums: [], songs: {} };
  d.fragments = (fr && Array.isArray(fr.fragments)) ? fr.fragments : (d.fragments || []);
  d.deleted = d.deleted || {};
  d.albumsOrderAt = d.albumsOrderAt || 0;
  d.albums.forEach(function(a){ a.songIds = a.songIds || []; a.updated = a.updated || 0; });
  d.bandleden = d.bandleden || [];
  Object.keys(d.songs).forEach(function(id){ var s = d.songs[id]; s.id = id; s.updated = s.updated || 0; });
  d.fragments.forEach(function(f){ f.updated = f.updated || 0; f.tags = f.tags || { type: [], sfeer: [], stanza: [] }; });
  return d;
}
function bewaarLokaal(){
  var lib = { albums: db.albums, songs: db.songs, deleted: db.deleted, albumsOrderAt: db.albumsOrderAt, bandleden: db.bandleden || [] };
  var ok = lsSet(LIB_KEY, lib) && lsSet(FRAG_KEY, { fragments: db.fragments });
  if (!ok) toast('Opslaan in deze browser lukt niet (privévenster?). Maak een back-up.');
}
function bewaarMeta(){ lsSet(META_KEY, meta); }
var wijzigTimer = null;
// elke wijziging: lokaal bewaren en (vertraagd) synchroniseren
function gewijzigd(){
  meta.seq = (meta.seq || 0) + 1; meta.dirty = true; bewaarMeta();
  clearTimeout(wijzigTimer);
  wijzigTimer = setTimeout(function(){ bewaarLokaal(); sync(); }, 1200);
}
function stempel(oud){ return Math.max(Date.now(), (oud || 0) + 1); }   // altijd nieuwer dan de versie waarop je verder werkte
function songInhoud(s){ return [s.title || '', s.key || '', s.bpm || '', s.lyrics || ''].join('\u0001'); }

// ---------- akkoorden: lezen, transponeren, weergeven ----------
var NOTEN_KRUIS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], NOTEN_MOL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var NOOT = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5, 'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11, Cb:11, 'E#':5, Fb:4, 'B#':0 };
function transponeerNoot(n, st, mol){ var i = NOOT[n]; if (i === undefined) return n; return (mol ? NOTEN_MOL : NOTEN_KRUIS)[(i + st + 120) % 12]; }
function transponeer(akk, st){
  if (!st) return akk;
  // werkt ook voor 'Bm A x2', 'C#m7/G#', 'F#m E'
  return akk.replace(/(^|[\s\/(|])([A-G][#b]?)/g, function(m, voor, n){ return voor + transponeerNoot(n, st, n.length > 1 && n[1] === 'b'); });
}
function eersteLaatste(tekst){
  var m = (tekst || '').match(/\[([^\]]+)\]/g) || [];
  if (!m.length) return { eerste: null, laatste: null };
  var a = m[0].slice(1,-1).trim().split(/\s+/)[0], z = m[m.length-1].slice(1,-1).trim().split(/\s+/); z = z[z.length-1];
  return { eerste: a, laatste: z };
}
function gebruikteAkkoorden(tekst){
  var gezien = {}, uit = [];
  ((tekst || '').match(/\[([^\]]+)\]/g) || []).forEach(function(m){
    m.slice(1,-1).trim().split(/\s+/).forEach(function(a){ if (/^[A-G]/.test(a) && !gezien[a]) { gezien[a] = 1; uit.push(a); } });
  });
  return uit;
}
// één regel -> stukjes (akkoord + tekst); elk woord apart zodat lange regels netjes omlopen
function lijnHtml(raw, st){
  var re = /\[([^\]]*)\]/g, stukken = [], laatste = 0, m, akk = '';
  while ((m = re.exec(raw)) !== null) {
    stukken.push({ c: akk, t: raw.slice(laatste, m.index) });
    akk = transponeer(m[1].trim(), st); laatste = re.lastIndex;
  }
  stukken.push({ c: akk, t: raw.slice(laatste) });
  var heeftAkk = stukken.some(function(s){ return s.c; });
  var heeftTekst = stukken.some(function(s){ return s.t.trim(); });
  if (heeftAkk && !heeftTekst) return '<div class="akkoordlijn">' + esc(stukken.map(function(s){ return s.c; }).filter(Boolean).join('   ')) + '</div>';
  var html = '';
  stukken.forEach(function(s, i){
    if (!s.c && !s.t) return;
    var woorden = s.t.match(/\S+\s*|\s+/g) || [''];
    woorden.forEach(function(w, k){
      var c = k === 0 ? s.c : '';
      html += '<span class="sg"><span class="c">' + (c ? esc(c) : '&nbsp;') + '</span>' + (esc(w) || (c ? ' ' : '')) + '</span>';
    });
  });
  return '<div class="lijn' + (heeftAkk ? '' : ' zonder') + '">' + html + '</div>';
}
function bladHtml(song, st){
  var tekst = song.lyrics || '', el1 = eersteLaatste(tekst);
  var info = '<div class="info"><div class="t">' + esc(song.title || '(naamloos)') + '</div><div class="r">' +
    'Toonaard: ' + esc(st ? transponeer(song.key || '–', st) : (song.key || '–')) + ' · BPM: ' + esc(song.bpm || '–') +
    ' · Eerste akkoord: ' + esc(el1.eerste ? transponeer(el1.eerste, st) : '–') + ' · Laatste: ' + esc(el1.laatste ? transponeer(el1.laatste, st) : '–') +
    (st ? ' · getransponeerd ' + (st > 0 ? '+' : '') + st : '') + '</div></div>';
  var html = '<div class="blok">';
  tekst.replace(/\r\n/g, '\n').split('\n').forEach(function(raw){
    var t = raw.trim();
    if (!t) { html += '<div class="wit"></div>'; return; }
    var sec = t.match(/^\{([^:}]+)\}$/);
    if (sec) { html += '</div><div class="blok"><div class="sectie-kop">' + esc(sec[1]) + '</div>'; return; }
    var c = t.match(/^\{c:\s*(.*)\}$/i);
    if (c) { html += '<div class="notitie">' + esc(c[1]) + '</div>'; return; }
    html += lijnHtml(raw, st);
  });
  return '<div class="blad">' + info + html + '</div></div>';
}

// ---------- huidige song, editor en weergave ----------
var editor = $('editor'), weergave = $('weergave'), balk = $('balk');
var huidigId = null, modus = 'bewerk', caret = 0, laatsteTyp = 0, ordenen = false;
function huidig(){ return huidigId ? db.songs[huidigId] : null; }
function albumVan(id){ for (var i = 0; i < db.albums.length; i++) if (db.albums[i].songIds.indexOf(id) >= 0) return db.albums[i]; return null; }
function eersteSong(){ for (var i = 0; i < db.albums.length; i++) if (db.albums[i].songIds.length) return db.albums[i].songIds[0]; var k = Object.keys(db.songs); return k[0] || null; }

function openSong(id, behoudModus){
  if (id && !db.songs[id]) id = null;
  huidigId = id; ui.laatste = id; lsSet(UI_KEY, ui);
  var s = huidig();
  editor.value = s ? (s.lyrics || '') : '';
  ui.transpose = 0;
  if (!behoudModus && s && !(s.lyrics || '').trim()) zetModus('bewerk');
  toonKop(); toonBalk(); toonWeergave(); renderLib();
  if (location.hash !== (id ? '#song=' + id : '')) history.replaceState(null, '', id ? '#song=' + id : location.pathname);
}
function toonKop(){
  if (ROL === 'vol' && hoofd !== 'song') { var kk = kopVanHoofd(); $('tTitel').textContent = kk[0]; $('tMeta').textContent = kk[1]; return; }
  var s = huidig();
  $('tTitel').textContent = s ? (s.title || '(naamloos)') : 'Songtool';
  var m = [];
  if (s) { if (s.key) m.push(s.key); if (s.bpm) m.push(s.bpm + ' BPM'); var a = albumVan(s.id); if (a) m.push(a.name); if (studioVersies(s).length) m.push('🎛 studio'); }
  $('tMeta').textContent = s ? (m.join(' · ') || 'tik voor titel, toonaard, BPM') : 'tik ☰ voor je bibliotheek';
  $('kModus').textContent = modus === 'bewerk' ? 'Blad' : 'Bewerk';
  $('kModus').classList.toggle('aan', modus === 'weergave');
}
function zetModus(m){
  modus = m;
  editor.classList.toggle('verborgen', m !== 'bewerk' || !huidig());
  weergave.classList.toggle('verborgen', m === 'bewerk' && !!huidig());
  if (m === 'bewerk') editor.blur();
  toonKop(); toonBalk(); toonWeergave();
}
function toonWeergave(){
  var s = huidig();
  editor.classList.toggle('verborgen', modus !== 'bewerk' || !s);
  weergave.classList.toggle('verborgen', !(modus === 'weergave' || !s));
  if (!s) {
    weergave.innerHTML = '';
    var leeg = el('div', { klasse: 'leeg' }, [
      el('p', { tekst: Object.keys(db.songs).length ? 'Kies een nummer in je bibliotheek.' : 'Nog geen nummers op dit toestel.' }),
      el('button', { klasse: 'primair', tekst: '☰ Bibliotheek', onclick: function(){ openLade('lib'); } }),
      !Object.keys(db.songs).length ? el('button', { tekst: '☁ Synchroniseren met Dropbox', onclick: toonSync }) : null,
      !Object.keys(db.songs).length ? el('button', { tekst: 'Back-up importeren', onclick: function(){ $('bestandJson').click(); } }) : null]);
    weergave.appendChild(leeg);
    return;
  }
  if (modus !== 'weergave') return;
  weergave.classList.toggle('passend', !!ui.passend);
  weergave.style.setProperty('--schaal', ui.passend ? 1 : schaal());
  weergave.innerHTML = bladHtml(s, ui.transpose || 0);
  if (ui.passend) pasIn();
}
function schaal(){ return ui.schaal || (window.innerWidth >= 700 ? 1.15 : 1); }   // op een iPad standaard iets groter
// Passend: de hele song op het scherm, zo groot mogelijk, in 1 tot 3 kolommen (iPad als muziekstandaard)
function pasIn(){
  var blad = weergave.querySelector('.blad'); if (!blad) return;
  weergave.style.overflow = '';            // schuifbalk van de vorige song mag de meting niet storen
  var hoog = weergave.clientHeight - 24, breed = weergave.clientWidth - 32, beste = null;
  for (var k = 1; k <= 3; k++) {
    if (k > 1 && breed / k < 260) break;
    blad.style.columnCount = k;
    var lo = 0.55, hi = 2.2;
    for (var i = 0; i < 9; i++) {                       // binair zoeken naar de grootste lettergrootte die past
      var mid = (lo + hi) / 2; weergave.style.setProperty('--schaal', mid);
      if (blad.scrollHeight <= hoog && blad.scrollWidth <= breed + 2) lo = mid; else hi = mid;
    }
    if (!beste || lo > beste.s * 1.08) beste = { k: k, s: lo };   // meer kolommen enkel als het duidelijk groter wordt
  }
  // nooit kleiner dan 14 px: dan liever een beetje scrollen dan onleesbaar
  var MIN = 14 / 17;
  if (beste.s < MIN) beste = { k: 1, s: MIN };   // kolommen die je moet scrollen lezen niet: dan één kolom
  blad.style.columnCount = beste.k;
  weergave.style.setProperty('--schaal', beste.s);
  weergave.style.overflow = blad.scrollHeight > hoog + 24 ? 'auto' : '';
}
window.addEventListener('resize', function(){ if (modus === 'weergave' && ui.passend) pasIn(); });

editor.addEventListener('input', function(){
  var s = huidig(); if (!s) return;
  if (Date.now() - laatsteTyp > 2000) onthoud(s);
  s.lyrics = editor.value; s.updated = stempel(s.updated); laatsteTyp = Date.now();
  caret = editor.selectionStart;
  gewijzigd(); toonBalkAkkoorden();
});
['keyup','click','select','blur'].forEach(function(ev){ editor.addEventListener(ev, function(){ caret = editor.selectionStart; }); });

// invoegen op de laatst gekende cursorplek (ook na tikken op een knop, waarbij het tekstvak de focus verliest)
function voegIn(tekst, regelbegin){
  var s = huidig(); if (!s) return;
  if (ROL === 'vol' && hoofd === 'song' && !isEditorStap()) naarStap('tekst');
  onthoud(s);
  var v = editor.value, p = Math.min(caret, v.length);
  if (regelbegin) {
    var begin = v.lastIndexOf('\n', p - 1) + 1;
    if (v.slice(begin, p).trim()) { tekst = '\n' + tekst; } else p = begin;
  }
  editor.value = v.slice(0, p) + tekst + v.slice(p);
  caret = p + tekst.length;
  editor.focus(); editor.setSelectionRange(caret, caret);
  s.lyrics = editor.value; s.updated = stempel(s.updated); gewijzigd(); toonBalkAkkoorden();
}

// werkbalk: in bewerkmodus secties en akkoorden, in weergave transponeren en lettergrootte
function toonBalk(){
  balk.innerHTML = '';
  var s = huidig();
  var zonder = ROL === 'vol' && (hoofd !== 'song' || (modus === 'bewerk' && !isEditorStap()));
  balk.classList.toggle('verborgen', !s || zonder);
  if (!s || zonder) return;
  if (modus === 'bewerk' && ROL === 'vol' && stapNu === 'tekst') {
    balk.appendChild(el('button', { klasse: 'chip sectie acc', tekst: '{ } Sectie', onclick: kiesSectie }));
    balk.appendChild(el('button', { klasse: 'chip sectie', tekst: '＋ Uit Fragments', onclick: function(){ openLade('frag'); } }));
    balk.appendChild(el('button', { klasse: 'chip sectie', style: 'color:var(--muse)', tekst: '✦ Muze', onclick: toonMuze }));
  } else if (modus === 'bewerk') {
    var invoer = el('input', { type: 'text', placeholder: '+ akkoord', autocapitalize: 'characters', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done' });
    invoer.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); var a = invoer.value.trim().replace(/[\[\]]/g, ''); if (a) { invoer.value = ''; voegIn('[' + a + ']'); } }
    });
    balk.appendChild(invoer);
    var vak = el('span', { id: 'akkVak', style: 'display:flex;gap:6px;flex:none' });
    balk.appendChild(vak);
    toonBalkAkkoorden();
  } else {
    var tr = ui.transpose || 0;
    function zetTr(d){ ui.transpose = tr + d; toonWeergave(); toonBalk(); }
    balk.appendChild(el('button', { klasse: 'chip sectie', tekst: '−', title: 'Halve toon lager', onclick: function(){ zetTr(-1); } }));
    balk.appendChild(el('span', { klasse: 'toon' + (tr ? ' acc' : ''), title: 'Toonaard (transponeren met − en +)',

function voegSamen(lok, ver, bewaarBeide){
  var uit = { albums: [], songs: {}, fragments: [], deleted: {}, albumsOrderAt: Math.max(lok.albumsOrderAt || 0, ver.albumsOrderAt || 0) };
  Object.keys(lok.deleted).concat(Object.keys(ver.deleted)).forEach(function(id){ uit.deleted[id] = Math.max(lok.deleted[id] || 0, ver.deleted[id] || 0); });

  Object.keys(ids).forEach(function(id){
    var a = lok.songs[id], b = ver.songs[id], w;
    if (a && b) {
      if (songInhoud(a) === songInhoud(b)) w = (a.updated || 0) >= (b.updated || 0) ? a : b;
      else if ((a.updated || 0) === (b.updated || 0) || bewaarBeide) {
        w = (a.updated || 0) >= (b.updated || 0) ? a : b;
        var ander = w === a ? b : a, kid = genId('song');
        if (!(a.updated || b.updated) || bewaarBeide) kopieen.push({ id: kid, van: id, song: Object.assign({}, ander, { id: kid, title: (ander.title || 'naamloos') + ' (kopie)', updated: Date.now() }) });
      } else w = a.updated > b.updated ? a : b;

    if ((uit.deleted[id] || 0) >= (w.updated || 0) && uit.deleted[id]) return;
    uit.songs[id] = w;
  });

  var albums = {};

    var a = lok.albums.filter(function(x){ return x.id === id; })[0], b = ver.albums.filter(function(x){ return x.id === id; })[0];
    var w = a && b ? ((a.updated || 0) >= (b.updated || 0) ? a : b) : (a || b);
    if (a && b) {   // nummers van beide kanten houden (verplaatst = staat in een ander album; dat lost de stap hieronder op)
      var l = w === a ? b : a, ex = l.songIds.filter(function(s){ return w.songIds.indexOf(s) < 0; });
      w = Object.assign({}, w, { songIds: w.songIds.concat(ex), _extra: ex });
    }

    albums[id] = Object.assign({}, w, { songIds: w.songIds.slice() });
  });

  var gezienA = {};
  volgorde.forEach(function(id){ if (albums[id] && !gezienA[id]) { gezienA[id] = 1; uit.albums.push(albums[id]); } });
  // elk nummer in precies één album (het recentst gewijzigde album wint)
  // eerst de eigen lijst van elk album (nieuwste album eerst), pas daarna nummers die enkel aangevuld werden
  var plek = {}, opVolgorde = uit.albums.slice().sort(function(a, b){ return (b.updated || 0) - (a.updated || 0); });
  opVolgorde.forEach(function(a){
    var extra = a._extra || [];
    a.songIds.forEach(function(sid){ if (extra.indexOf(sid) < 0 && uit.songs[sid] && !plek[sid]) plek[sid] = a.id; });
  });
  opVolgorde.forEach(function(a){ (a._extra || []).forEach(function(sid){ if (uit.songs[sid] && !plek[sid]) plek[sid] = a.id; }); });
  uit.albums.forEach(function(a){
    var gezien = {};

    delete a._extra;
  });
  kopieen.forEach(function(k){
    uit.songs[k.id] = k.song;
    var a = uit.albums.filter(function(x){ return x.id === plek[k.van]; })[0];
    if (a) { a.songIds.splice(a.songIds.indexOf(k.van) + 1, 0, k.id); plek[k.id] = a.id; }
  });
  var los = Object.keys(uit.songs).filter(function(sid){ return !plek[sid]; });
  if (los.length) {
    var z = uit.albums.filter(function(x){ return x.id === 'album-zonder'; })[0];
    if (!z) { z = { id: 'album-zonder', name: 'Zonder album', songIds: [], updated: Date.now() }; uit.albums.push(z); }

  uit.bandleden = Object.keys(leden).map(function(k){ return leden[k]; }).filter(function(l){ return !l.weg; });

  var voor = bandNieuw();

    return deelLijst(l.link).then(function(lijst){
      var g = zoekIn(lijst, 'gedeeld.json'); if (!g) return;
      var versie = g.rev || g.server_modified;

    }).catch(function(e){ console.warn('Bandlid', l.naam, e.message); });
  })).then(function(){
    lsSet('songtool_bandleden_v1', bandStof);

// runs: aanwijzingen van het bandlid bij een regel van de tekst of bij een maat (Toms tekst blijft onaangeroerd).
// Een regel wordt herkend aan zijn tekst (+ de hoeveelste keer die regel voorkomt), zodat de notitie blijft staan
// als Tom elders in het nummer iets wijzigt.
function bRegelSleutels(s){
  var tel = {}, uit = [];
  (s.lyrics || '').replace(/\r\n/g, '\n').split('\n').forEach(function(raw){
    var t = raw.trim();
    if (!t || /^\{([^:}]+)\}$/.test(t) || /^\{c:/i.test(t)) return;
    var k = norm(raw.replace(/\[[^\]]*\]/g, '')) || ('akk' + norm(raw));
    tel[k] = (tel[k] || 0) + 1;
    uit.push({ sleutel: 'regel:' + k + '#' + tel[k], tekst: raw.replace(/\[[^\]]*\]/g, '').trim() || raw.trim() });
  });
  return uit;
}
function bRunsInBlad(s){
  var regels = bRegelSleutels(s), els = weergave.querySelectorAll('.blad .lijn, .blad .akkoordlijn'), runs = bdb.runs[bHuidig] || {};
  [].forEach.call(els, function(e, i){
    var r = regels[i]; if (!r) return;
    var run = (runs[r.sleutel] || {}).tekst;
    if (run) e.insertAdjacentHTML('afterend', '<div class="run">↳ ' + esc(run) + '</div>');
    if (bRunsModus) { e.classList.add('tikbaar'); e.addEventListener('click', function(){ bRunVel(r.sleutel, null, r.tekst); }); }
  });
}

    oud.tekst ? el('button', { klasse: 'gevaar', tekst: 'Wissen', onclick: function(){ runs[key] = { tekst: '', updated: Date.now() }; bWijzig(); sluitVel(); bToon(); } }) : null])]);

// meespelen: master / zonder bas / bas alleen, naar een sectie of maat springen, herhalen, trager
var bAudio = null, bBron = 'zonder_bas', bLus = null, bSnel = 1, bRaf = null;

function bMaatS(o){ return (parseInt(String(o.maatsoort || '4/4'), 10) || 4) * 60 / (o.tempo || 100); }
function bTijdVanMaat(o, m){ return (o.maat1_op || 0) + (m - 1) * bMaatS(o); }
function bMaatVanTijd(o, t){ return Math.floor((t - (o.maat1_op || 0)) / bMaatS(o)) + 1; }
function bSpelerStop(){ if (bAudio) { bAudio.pause(); bAudio = null; } bLus = null; cancelAnimationFrame(bRaf); }
function bSpelerToon(o){
  var sp = $('bspeler'); sp.innerHTML = '';
  if (!o || !o.audio || !o.audio.master) { sp.classList.add('verborgen'); return; }
  sp.classList.remove('verborgen');
  var bronnen = Object.keys(BRONNAAM).filter(function(k){ return o.audio[k]; });
  if (bronnen.indexOf(bBron) < 0) bBron = bronnen.indexOf('zonder_bas') >= 0 ? 'zonder_bas' : 'master';
  var speel = el('button', { klasse: 'speel', tekst: bAudio && !bAudio.paused ? '❚❚' : '▶', onclick: function(){ bSpeel(o); } });
  var tijd = el('span', { klasse: 'btijd', id: 'btijd', tekst: bAudio ? bTijdTekst(o) : (o.mix ? 'mix: ' + o.mix : '') });
  sp.appendChild(el('div', { klasse: 'brij' }, [speel,
    el('div', { klasse: 'bronnen' }, bronnen.map(function(k){ return el('button', { klasse: 'chip sectie' + (k === bBron ? ' aan' : ''), tekst: BRONNAAM[k], onclick: function(){ bWissel(o, k); } }); })), tijd]));
  sp.appendChild(el('div', { klasse: 'brij secties' }, [
    el('button', { klasse: 'chip sectie' + (bLus ? ' aan' : ''), tekst: '🔁', title: 'Herhaal de sectie waar je nu bent', onclick: function(){ bHerhaal(o); } }),
    el('button', { klasse: 'chip sectie' + (bSnel < 1 ? ' aan' : ''), tekst: Math.round(bSnel * 100) + '%', title: 'Trager meespelen (zelfde toonhoogte)', onclick: function(){ bSnel = bSnel === 1 ? 0.85 : (bSnel === 0.85 ? 0.75 : 1); if (bAudio) bAudio.playbackRate = bSnel; bSpelerToon(o); } }),
    el('span', { klasse: 'zacht klein', style: 'flex:none', tekst: '|' })].concat((o.secties || []).map(function(x){
    return el('button', { klasse: 'chip sectie' + (bLus && bLus.start === x.start ? ' aan' : ''), tekst: x.naam, onclick: function(){ bSpring(x.start); } });
  }))));
}
function bTijdTekst(o){
  var t = bAudio ? bAudio.currentTime : 0, m = bMaatVanTijd(o, t);
  return duurTekst(t) + (m >= 1 ? ' · maat ' + m : ' · intel');
}
function bLaad(o, bron){
  var pad = '/' + o.audio[bron], sleutel = pad + '@' + (o.gemaakt || '');
  return idbDoe('readonly', function(st){ return st.get(sleutel); }, 'audio').catch(function(){ return null; }).then(function(b){
    if (b) return b;
    $('btijd').textContent = 'Laden… (de eerste keer, daarna ook offline)';
    return deelBestand(bdb.link, pad, true).then(function(blob){
      idbDoe('readwrite', function(st){ return st.put(blob, sleutel); }, 'audio').catch(function(){});
      return blob;
    });
  });
}
function bWissel(o, bron){
  var t = bAudio ? bAudio.currentTime : null, speelde = bAudio && !bAudio.paused;
  bBron = bron;
  if (!bAudio) { bSpelerToon(o); return; }
  bAudio.pause();
  bLaad(o, bron).then(function(blob){
    var a = new Audio(URL.createObjectURL(blob)); bZetAudio(a, o);
    a.addEventListener('loadedmetadata', function(){ a.currentTime = t || 0; if (speelde) a.play(); }, { once: true });
    bSpelerToon(o);
  }).catch(function(e){ toast('Laden lukt niet: ' + scopeFout(e)); });
}
function bZetAudio(a, o){
  bAudio = a; a.playbackRate = bSnel; a.preservesPitch = true; a.webkitPreservesPitch = true;
  a.addEventListener('play', function(){ bLoop(o); bKnop(); });
  a.addEventListener('pause', bKnop); a.addEventListener('ended', bKnop);
  // herhalen ook als het scherm niet ververst (vergrendeld, achtergrond): de audio zelf meldt de tijd
  a.addEventListener('timeupdate', function(){ if (bLus && a.currentTime >= bLus.b) a.currentTime = bLus.a; });
}
function bKnop(){ var k = document.querySelector('#bspeler .speel'); if (k) k.textContent = bAudio && !bAudio.paused ? '❚❚' : '▶'; }
function bSpeel(o, vanaf){
  if (bAudio) { if (vanaf != null) bAudio.currentTime = vanaf; if (bAudio.paused || vanaf != null) bAudio.play(); else bAudio.pause(); return; }
  bLaad(o, bBron).then(function(blob){
    var a = new Audio(URL.createObjectURL(blob)); bZetAudio(a, o);
    a.addEventListener('loadedmetadata', function(){ if (vanaf != null) a.currentTime = vanaf; a.play(); }, { once: true });
  }).catch(function(e){ toast('Laden lukt niet: ' + scopeFout(e)); });
}
function bSpring(maat){ var o = bOpn(bHuidig); if (!o) return; if (bLus) bLus = null; bSpeel(o, Math.max(0, bTijdVanMaat(o, maat) - 0.05)); bSpelerToon(o); }
function bHerhaal(o){
  if (bLus) { bLus = null; bSpelerToon(o); return; }
  var m = bAudio ? bMaatVanTijd(o, bAudio.currentTime) : 1;
  var x = (o.secties || []).filter(function(y){ return y.start <= m && m <= y.eind; })[0] || (o.secties || [])[0];
  if (!x) return;
  bLus = { start: x.start, eind: x.eind, a: bTijdVanMaat(o, x.start), b: bTijdVanMaat(o, x.eind + 1) };
  if (!bAudio || bAudio.currentTime < bLus.a || bAudio.currentTime > bLus.b) bSpeel(o, bLus.a);
  bSpelerToon(o); toast('Herhaal ' + x.naam + ' (maat ' + x.start + '–' + x.eind + ')');
}
function bLoop(o){
  cancelAnimationFrame(bRaf);
  var vorige = 0;
  (function stap(){
    if (!bAudio || bAudio.paused) return;
    var t = bAudio.currentTime;
    if (bLus && t >= bLus.b) bAudio.currentTime = bLus.a;
    var tt = $('btijd'); if (tt) tt.textContent = bTijdTekst(o);
    var m = bMaatVanTijd(o, t);
    if (m !== vorige && bWeergave === 'maten') {
      var oud = weergave.querySelector('.maat.nu'); if (oud) oud.classList.remove('nu');
      var c = weergave.querySelector('.maat[data-maat="' + m + '"]');
      if (c) { c.classList.add('nu'); var r = c.getBoundingClientRect(), w = weergave.getBoundingClientRect(); if (r.top < w.top || r.bottom > w.bottom) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      vorige = m;
    }
    bRaf = requestAnimationFrame(stap);
  })();
}

// opnames van het bandlid (eigen map; delen met Tom via Gedeeld/)
function bandMemoBewaar(blob, mime, duur){
  var id = genId('memo'), ext = extVoor(mime), pad = '/memos/' + id + '.' + ext, s = bSongs()[bHuidig];
  return memoBewaar(id, { blob: blob, type: mime, geupload: false, pad: pad }).then(function(){
    bdb.memos.unshift({ id: id, created: Date.now(), updated: Date.now(), duur: Math.round(duur * 10) / 10, pad: pad, ext: ext, type: mime,
                        songId: bHuidig, songTitel: s ? s.title : '', gedeeld: false, notitie: '' });
    bWijzig(); toast('Opname bewaard'); mijnOpnames();
  });
}
function mijnOpnames(){
  var lijst = bdb.memos.filter(function(x){ return !bdb.deleted[x.id]; });
  openVel('Mijn opnames', [
    el('div', { klasse: 'knoppen', style: 'margin:0 0 10px' }, [el('button', { klasse: 'primair', tekst: '🎙 Nieuwe opname', onclick: function(){ sluitVel(); opnemen(null); } })]),
    lijst.length ? null : el('p', { klasse: 'zacht', tekst: 'Nog geen opnames.' })].concat(lijst.map(function(x){
    var speler = el('div');
    return el('div', { klasse: 'frag' }, [
      el('div', { klasse: 'zacht klein', tekst: (x.songTitel || 'Los idee') + ' · ' + wanneer(x.created) + ' · ' + duurTekst(x.duur) + (x.gedeeld ? ' · gedeeld met Tom' : '') }),
      x.notitie ? el('div', { klasse: 'tx', tekst: x.notitie }) : null,
      el('div', { klasse: 'ac' }, [
        el('button', { tekst: '▶', onclick: function(){ speelMemo({ id: x.id, memo: { pad: x.pad } }, speler); } }),
        el('button', { klasse: x.gedeeld ? 'aan-gedeeld' : '', tekst: x.gedeeld ? '✓ Gedeeld met Tom' : 'Deel met Tom', onclick: function(){
          if (!x.gedeeld && !bdb.naam) { var n = prompt('Je naam (zo ziet Tom van wie het komt):', ''); if (!n || !n.trim()) return; bdb.naam = n.trim(); }
          x.gedeeld = !x.gedeeld; x.updated = Date.now(); bWijzig(); mijnOpnames();
          if (x.gedeeld && !bdb.tomWeet) toast('Gedeeld. Stuur Tom één keer je deel-link: ⋯ › Delen met Tom');
        } }),
        el('button', { tekst: '✎', onclick: function(){ var t = prompt('Notitie bij deze opname:', x.notitie || ''); if (t !== null) { x.notitie = t.trim(); x.updated = Date.now(); bWijzig(); mijnOpnames(); } } }),
        el('button', { klasse: 'gevaar', tekst: '🗑', onclick: function(){ if (confirm('Deze opname uit je lijst halen?')) { bdb.deleted[x.id] = Date.now(); x.gedeeld = false; x.updated = Date.now(); bWijzig(); mijnOpnames(); } } })]),
      speler]);
  })));
}
function bandMenu(){
  openVel('Menu', [
    menuItem('🎙', 'Mijn opnames', bdb.memos.length ? bdb.memos.length + ' opname(s)' : 'Neem een idee op', mijnOpnames),
    menuItem('↗', 'Delen met Tom', 'Stuur Tom één keer deze link: dan ziet hij wat jij deelt', function(){
      if (!verbonden()) { toonSync(); return; }
      if (!bdb.naam) { var n = prompt('Je naam (zo ziet Tom van wie het komt):', ''); if (!n || !n.trim()) return; bdb.naam = n.trim(); bWijzig(); }
      schrijfGedeeld(true).then(function(){ return maakDeelLink('/Gedeeld'); }).then(function(link){
        bdb.tomWeet = true; bWijzig();
        deel('Songtool – ' + bdb.naam, 'Open dit in je Songtool om te zien wat ik deel:', basisUrl() + '#bandlid=' + encodeURIComponent(link) + '&naam=' + encodeURIComponent(bdb.naam));
      }).catch(function(e){ alert(scopeFout(e)); });
    }),
    menuItem('🖨', 'Afdrukken / PDF', 'Dit nummer', function(){ var s = bSongs()[bHuidig]; if (s) drukAf([s]); }),
    menuItem('☁', 'Synchronisatie', syncUitleg(), toonSync),
    menuItem('?', 'Hulp', null, function(){ openVel('Hulp', [el('div', { klasse: 'help', html:
      '<p><b>Blad</b>: tekst en akkoorden van Tom (je kan niets wijzigen; transponeren en "Passend" gelden enkel voor jou).</p>' +
      '<p><b>Maten</b>: de akkoorden per maat, per sectie. Tik op een maat om daar te beginnen spelen.</p>' +
      '<p><b>Meespelen</b>: kies "Zonder bas" om mee te spelen of "Bas alleen" om te leren; tik op een sectie om ernaartoe te springen, 🔁 herhaalt de sectie, 85% / 75% is trager zonder dat de toonhoogte verandert. Wat je één keer beluisterde, werkt daarna ook offline.</p>' +
      '<p><b>🎛 Sound & notitie</b>: per nummer je sound (versterker, pedalen, instellingen) en een notitie; ze staan bovenaan het nummer.</p>' +
      '<p><b>✎ Runs</b>: zet de knop aan en tik op een regel (Blad) of een maat (Maten) om er een run of aanwijzing bij te noteren.</p>' +
      '<p>Notities, runs en <b>opnames</b> zijn van jou, op al je toestellen. Een opname deel je met Tom met "Deel met Tom".</p>' })]); })]);
}
function schrijfGedeeld(altijd){
  var items = bdb.memos.filter(function(x){ return x.gedeeld && !bdb.deleted[x.id]; });
  var inh = { app: 'Songtool', naam: bdb.naam || 'Bandlid', items: items.map(function(x){
    return { id: x.id, songId: x.songId, songTitel: x.songTitel, created: x.created, gedeeld: x.updated, duur: x.duur, notitie: x.notitie, bestand: x.id + '.' + x.ext };
  }) };
  var h = hash(JSON.stringify(inh));
  bmeta.gekopieerd = bmeta.gekopieerd || {};
  var keten = Promise.resolve();
  items.forEach(function(x){
    if (bmeta.gekopieerd[x.id]) return;
    keten = keten.then(function(){ return rpc('files/copy_v2', { from_path: x.pad, to_path: '/Gedeeld/' + x.id + '.' + x.ext, autorename: false }); })
      .then(function(){ bmeta.gekopieerd[x.id] = 1; }, function(e){ if (e.status === 409 && /to\/conflict/.test(e.message)) bmeta.gekopieerd[x.id] = 1; else throw e; });
  });
  Object.keys(bmeta.gekopieerd).forEach(function(id){
    if (items.some(function(x){ return x.id === id; })) return;
    var x = bdb.memos.filter(function(y){ return y.id === id; })[0];
    keten = keten.then(function(){ return rpc('files/delete_v2', { path: '/Gedeeld/' + id + '.' + (x ? x.ext : 'm4a') }).catch(function(){}); })
      .then(function(){ delete bmeta.gekopieerd[id]; });
  });
  return keten.then(function(){
    if (!altijd && h === bmeta.gedeeldHash) return;
    return zetBestand('/Gedeeld/gedeeld.json', JSON.stringify(inh), { '.tag': 'overwrite' }).then(function(){ bmeta.gedeeldHash = h; lsSet(BMETA_KEY, bmeta); });
  });
}
function bVoegSamen(a, b){
  var uit = { notities: {}, memos: [], deleted: {}, naam: a.naam || b.naam, link: (a.linkTijd || 0) >= (b.linkTijd || 0) ? (a.link || b.link) : (b.link || a.link),
              linkTijd: Math.max(a.linkTijd || 0, b.linkTijd || 0), tomWeet: a.tomWeet || b.tomWeet };
  Object.keys(a.notities || {}).concat(Object.keys(b.notities || {})).forEach(function(k){
    var x = (a.notities || {})[k], y = (b.notities || {})[k];
    uit.notities[k] = !x ? y : (!y ? x : ((x.updated || 0) >= (y.updated || 0) ? x : y));
  });
  Object.keys(a.deleted || {}).concat(Object.keys(b.deleted || {})).forEach(function(k){ uit.deleted[k] = Math.max((a.deleted || {})[k] || 0, (b.deleted || {})[k] || 0); });
  uit.runs = {};
  Object.keys(a.runs || {}).concat(Object.keys(b.runs || {})).forEach(function(song){
    var x = (a.runs || {})[song] || {}, y = (b.runs || {})[song] || {}, r = uit.runs[song] = {};
    Object.keys(x).concat(Object.keys(y)).forEach(function(k){ r[k] = !x[k] ? y[k] : (!y[k] ? x[k] : ((x[k].updated || 0) >= (y[k].updated || 0) ? x[k] : y[k])); });
  });
  var mm = {};
  (a.memos || []).concat(b.memos || []).forEach(function(x){ if (!mm[x.id] || (x.updated || 0) > (mm[x.id].updated || 0)) mm[x.id] = x; });
  uit.memos = Object.keys(mm).map(function(k){ return mm[k]; }).sort(function(x, y){ return y.created - x.created; });
  return uit;
}
function bandSync(){
  if (!verbonden() || !navigator.onLine) { zetDot(verbonden() ? 'bezig' : '', verbonden() ? 'Offline' : null); return Promise.resolve(); }
  if (bSyncBezig) return Promise.resolve();
  bSyncBezig = true; zetDot('bezig', 'Synchroniseren…');
  var poging = 0;
  function eigen(){
    poging++;
    return rpc('files/list_folder', { path: '' }).then(function(lijst){
      var f = zoekIn(lijst, 'bandlid.json');
      var stap = Promise.resolve();
      if (f && f.rev !== bmeta.rev) stap = haalBestand('/bandlid.json').then(function(x){
        var ver = JSON.parse(x), samen = bVoegSamen(bdb, ver), was = JSON.stringify(bdb);
        if (JSON.stringify(samen) !== was) { bdb = samen; lsSet(BDB_KEY, bdb); bToon(); }
        bmeta.rev = f.rev;
        if (JSON.stringify(samen) !== JSON.stringify(bVoegSamen(ver, ver))) { bmeta.dirty = true; bmeta.seq = (bmeta.seq || 0) + 1; }
      });
      return stap.then(function(){
        if (f && !bmeta.dirty) return;
        var seq = bmeta.seq;
        return zetBestand('/bandlid.json', JSON.stringify(bdb), f ? { '.tag': 'update', update: f.rev } : { '.tag': 'add' }).then(function(r){
          bmeta.rev = r.rev; if (bmeta.seq === seq) bmeta.dirty = false;
        }, function(e){ if (e.status === 409 && poging < 4) return eigen(); throw e; });
      });
    });
  }
  function vanTom(){
    if (!bdb.link) return Promise.resolve();
    return deelLijst(bdb.link).then(function(lijst){
      var b = zoekIn(lijst, 'band.json'), o = zoekIn(lijst, 'opnames.json'), werk = [];
      var vb = b && (b.rev || b.server_modified), vo = o && (o.rev || o.server_modified);
      if (b && vb !== bstof.vBand) werk.push(deelBestand(bdb.link, '/band.json').then(function(x){ bstof.band = JSON.parse(x); bstof.vBand = vb; }));
      if (o && vo !== bstof.vOpn) werk.push(deelBestand(bdb.link, '/opnames.json').then(function(x){ bstof.opnames = JSON.parse(x); bstof.vOpn = vo; }));
      if (!werk.length) return;
      return Promise.all(werk).then(function(){
        lsSet(BSTOF_KEY, bstof);
        if (!bHuidig || !bSongs()[bHuidig]) bOpen(bEerste());
        else if (!(bAudio && !bAudio.paused)) bToon();        // niet storen terwijl je meespeelt
        if ($('lib').classList.contains('open')) renderBandLib();
      });
    });
  }
  return eigen().then(function(){ return uploadMemos(); }).then(function(){ return schrijfGedeeld(false); }).then(vanTom).then(function(){
    syncFout = null; meta.laatsteSync = Date.now(); zetDot('ok');
  }, function(e){
    syncFout = e.status === 401 ? 'toegang verlopen: verbind opnieuw' : (navigator.onLine ? scopeFout(e) : 'offline');
    zetDot(navigator.onLine ? 'fout' : 'bezig', syncFout);
  }).then(function(){ bSyncBezig = false; lsSet(BMETA_KEY, bmeta); });
}

// ---------- start ----------
db = laadDb();
meta = lsGet(META_KEY, {});
auth = lsGet(AUTH_KEY, {});
ui = lsGet(UI_KEY, {});
studio = lsGet(STUDIO_KEY, null);
memoInfo = lsGet(MEMO_KEY, null);
if (ui.vastLib !== false && window.matchMedia('(min-width: 1000px)').matches) { document.body.classList.add('vast-lib'); $('lib').classList.add('open'); }
pasAan();
if (ROL === 'band') bandStart();
else (function(){
  ontvangBandlid(); toonBandBadge();
  var m = location.hash.match(/song=([\w\-]+)/);
  var start = (m && db.songs[m[1]]) ? m[1] : (db.songs[ui.laatste] ? ui.laatste : eersteSong());
  modus = 'bewerk';
  openSong(start);
  if (m && db.songs[m[1]]) naarSong(m[1]); else tekenHoofd();
  zetDot(verbonden() ? 'bezig' : '', null);
  if (m && !db.songs[m[1]] && verbonden()) { sync().then(function(){ if (db.songs[m[1]]) naarSong(m[1]); }); } else sync();
})();
</script>
