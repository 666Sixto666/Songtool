<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Songtool">
<meta name="theme-color" content="#1b1a17">
<title>Songtool</title>
<style>
:root{
  --bg:#1b1a17; --panel:#242220; --panel2:#2c2a26; --ink:#f2ede4; --dim:#b9b2a4; --accent:#d99b3f;
  --accent2:#7fa694; --line:#3a372f; --muse:#8a6fae; --fout:#e06c6c; --ok:#7fa694;
  --mono: Menlo, 'Courier New', Consolas, monospace; --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --vh: 100vh; --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
body{ font-family:var(--sans); font-size:16px; }
button{ font:inherit; color:inherit; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 12px; cursor:pointer; }
button:active{ border-color:var(--accent); }
button.primair{ background:var(--accent); color:#1b1a17; border-color:var(--accent); font-weight:600; }
button.gevaar{ color:var(--fout); }
button.plat{ background:none; border:none; padding:6px 8px; }
input,textarea,select{ font:inherit; font-size:16px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%; }
input:focus,textarea:focus{ outline:none; border-color:var(--accent); }
.verborgen{ display:none !important; }
.zacht{ color:var(--dim); }
.klein{ font-size:13px; }

/* ---------- app-raamwerk: past altijd in het zichtbare deel (ook met toetsenbord open) ---------- */
#app{ position:fixed; left:0; right:0; top:0; height:var(--vh); display:flex; flex-direction:column; }
.kop{ flex:none; display:flex; align-items:center; gap:4px; padding:calc(6px + var(--top)) 8px 6px; background:var(--panel); border-bottom:1px solid var(--line); min-height:52px; }
.ib{ flex:none; width:42px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; font-size:20px; background:none; border:none; border-radius:10px; }
.ib:active{ background:var(--panel2); }
.titelknop{ flex:1; min-width:0; text-align:left; background:none; border:none; padding:2px 6px; }
.titelknop .t{ display:block; font-family:var(--serif); font-size:18px; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titelknop .m{ display:block; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.modus{ flex:none; height:36px; padding:0 12px; border-radius:18px; font-size:14px; }
.modus.aan{ background:var(--accent); color:#1b1a17; border-color:var(--accent); }
.dot{ flex:none; width:10px; height:10px; border-radius:50%; background:#5b574e; margin:0 4px; }
.dot.ok{ background:var(--ok); } .dot.bezig{ background:var(--accent); } .dot.fout{ background:var(--fout); }

.balk{ flex:none; display:flex; gap:6px; align-items:center; padding:6px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--line); background:var(--bg); scrollbar-width:none; }
.balk::-webkit-scrollbar{ display:none; }
.chip{ flex:none; padding:6px 11px; border-radius:16px; font-family:var(--mono); font-size:14px; background:var(--panel2); }
.chip.sectie{ font-family:var(--sans); }
.chip.acc{ color:var(--accent); }
.balk input{ flex:none; width:110px; padding:6px 10px; border-radius:16px; }

main{ flex:1; min-height:0; position:relative; }
#editor{ position:absolute; inset:0; width:100%; height:100%; border:none; border-radius:0; resize:none; padding:14px 14px calc(30px + var(--bot)); font-family:var(--mono); font-size:16px; line-height:1.55; background:var(--bg); -webkit-overflow-scrolling:touch; }
#weergave{ position:absolute; inset:0; overflow:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(40px + var(--bot)); }
.leeg{ padding:40px 24px; text-align:center; color:var(--dim); line-height:1.6; }
.leeg button{ margin:6px; }

/* ---------- weergave (akkoorden boven de lettergreep, ook als de regel omloopt) ---------- */
.blad{ font-family:var(--serif); font-size:calc(17px * var(--schaal, 1)); line-height:1.25; max-width:760px; margin:0 auto; }
.info{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:16px; background:var(--panel); }
.info .t{ font-size:1.25em; color:var(--accent); }
.info .r{ font-family:var(--sans); font-size:13px; color:var(--dim); margin-top:4px; }
.sectie-kop{ font-family:var(--sans); font-weight:700; font-size:.78em; letter-spacing:.06em; text-transform:uppercase; color:var(--accent2); margin:18px 0 6px; }
.notitie{ font-style:italic; color:var(--dim); font-size:.9em; margin:4px 0 2px; }
.lijn{ margin:0 0 6px; }
.sg{ display:inline-block; vertical-align:bottom; white-space:pre; }
.sg .c{ display:block; font-family:var(--mono); font-weight:700; color:var(--accent); font-size:.82em; min-height:1.2em; padding-right:.35em; }
.lijn.zonder .sg .c{ display:none; }
.akkoordlijn{ font-family:var(--mono); font-weight:700; color:var(--accent); font-size:.85em; margin:2px 0 8px; white-space:pre-wrap; }
.wit{ height:.7em; }


.toon{ flex:none; min-width:44px; text-align:center; font-family:var(--mono); font-weight:700; color:var(--ink); }
.toon.acc{ color:var(--accent); }
.chip.aan{ background:var(--accent); color:#1b1a17; border-color:var(--accent); }
#weergave.passend{ overflow:hidden; padding:12px 16px; }
#weergave.passend .blad{ max-width:none; column-gap:36px; column-rule:1px solid var(--line); }
#weergave.passend .info{ column-span:all; margin-bottom:10px; padding:6px 10px; }
.blok{ break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid; }
/* ---------- lades (bibliotheek links, fragmenten rechts) ---------- */
.scherm{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; }
.lade{ position:fixed; top:0; bottom:0; width:min(92vw, 400px); background:var(--panel); z-index:21; display:flex; flex-direction:column; transition:transform .2s ease; padding-top:var(--top); }
.lade.links{ left:0; transform:translateX(-102%); border-right:1px solid var(--line); }
.lade.rechts{ right:0; transform:translateX(102%); border-left:1px solid var(--line); }
.lade.open{ transform:none; }
.lade-kop{ flex:none; display:flex; align-items:center; gap:6px; padding:8px 8px 8px 14px; border-bottom:1px solid var(--line); }
.lade-kop b{ flex:1; font-family:var(--serif); font-size:18px; color:var(--accent); }
.lade-zoek{ flex:none; padding:8px 10px; border-bottom:1px solid var(--line); }
.lade-lijst{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:4px 0 20px; }
.lade-voet{ flex:none; display:flex; gap:8px; padding:8px 10px calc(8px + var(--bot)); border-top:1px solid var(--line); }
.lade-voet button{ flex:1; }
.album{ margin:6px 0 2px; }
.album-kop{ display:flex; align-items:center; padding:8px 6px 4px 14px; }
.album-kop .n{ flex:1; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
.nummer{ display:flex; align-items:center; gap:4px; padding:0 6px 0 14px; min-height:48px; border-left:3px solid transparent; }
.nummer.actief{ background:var(--panel2); border-left-color:var(--accent); }
.nummer .tt{ flex:1; min-width:0; padding:6px 0; }
.nummer .tt span{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nummer .tt .mm{ font-size:12px; color:var(--dim); }
.nummer .ord{ display:flex; gap:2px; }
.nummer .ord button{ width:36px; height:34px; padding:0; }
.studio-teken{ font-size:12px; color:var(--accent2); margin-left:4px; }
@media (min-width: 1000px){
  /* breed scherm: bibliotheek blijft naast de tekst staan */
  body.vast-lib .lade.links{ transform:none; position:fixed; width:320px; }
  body.vast-lib #app{ left:320px; }
  body.vast-lib #scherm-lib{ display:none !important; }
}

.frag{ margin:8px 10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
.frag .tx{ white-space:pre-wrap; font-family:var(--serif); line-height:1.4; }
.frag .tg{ margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
.pil{ font-size:11px; padding:2px 8px; border-radius:10px; background:var(--panel2); color:var(--dim); }
.pil.type{ color:var(--accent); } .pil.sfeer{ color:var(--muse); } .pil.stanza{ color:var(--accent2); }
.frag .ac{ display:flex; gap:6px; margin-top:8px; }
.memo{ margin:6px 0 2px; }
.memo .mini-blad{ max-height:none; background:var(--panel); }
.memo .blad{ font-size:15px; }
.melodie{ font-family:var(--mono); font-size:13px; color:var(--accent2); margin:6px 0; line-height:1.6; }
.frag .ac button{ padding:6px 10px; font-size:14px; }
.filters{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); }
.filters .chip{ font-family:var(--sans); font-size:13px; padding:4px 10px; }
.filters .chip.aan{ background:var(--accent); color:#1b1a17; }

/* ---------- blad onderaan (menu, songinfo, studio, sync, ...) ---------- */
.vel{ position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; max-height:calc(var(--vh) - var(--top) - 24px); display:flex; flex-direction:column; transform:translateY(105%); transition:transform .2s ease; }
.vel.open{ transform:none; }
@media (min-width: 700px){ .vel{ left:50%; right:auto; width:620px; margin-left:-310px; } }
.vel-kop{ flex:none; display:flex; align-items:center; padding:10px 8px 8px 16px; border-bottom:1px solid var(--line); }
.vel-kop b{ flex:1; font-size:17px; }
.vel-inhoud{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:12px 16px calc(18px + var(--bot)); }
#scherm-vel{ z-index:30; }
.menu-item{ display:flex; width:100%; align-items:center; gap:12px; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); border-radius:0; padding:14px 4px; }
.menu-item:last-child{ border-bottom:none; }
.menu-item .i{ width:26px; text-align:center; font-size:19px; }
.menu-item .u{ display:block; font-size:12px; color:var(--dim); }
.veld{ display:block; margin:0 0 12px; }
.veld > span{ display:block; font-size:13px; color:var(--dim); margin-bottom:4px; }
.rij{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.rij > *{ flex:1; }
.knoppen{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.melding{ padding:10px 12px; border-radius:10px; background:var(--panel2); margin:0 0 12px; line-height:1.45; font-size:14px; }
.melding.fout{ color:#f3b3b3; background:#3d2424; }
.statuschips{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; }
.sc{ font-size:12px; padding:3px 9px; border-radius:10px; background:var(--panel2); color:var(--dim); }
.sc.klaar{ color:var(--ok); } .sc.oud{ color:var(--accent); }
.studio-versie{ border:1px solid var(--line); border-radius:12px; padding:12px; margin:0 0 14px; background:var(--bg); }
.studio-versie h3{ margin:0 0 2px; font-size:16px; }
.mini-blad{ max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:10px; margin:8px 0; font-size:14px; }
audio{ width:100%; margin-top:8px; }
.toast{ position:fixed; left:50%; bottom:calc(24px + var(--bot)); transform:translateX(-50%); background:#000c; color:#fff; padding:10px 16px; border-radius:20px; z-index:50; font-size:14px; pointer-events:none; max-width:90vw; text-align:center; }
.help code{ font-family:var(--mono); color:var(--accent); }
.help p{ margin:0 0 10px; line-height:1.5; font-size:14px; }

#printvak{ display:none; }
@media print{
  html,body{ overflow:visible; height:auto; background:#fff; color:#000; }
  #app,.lade,.scherm,.vel,.toast{ display:none !important; }
  #printvak{ display:block; }
  .blad{ font-size:12.5pt; max-width:none; }
  .info{ background:#fff; border-color:#000; } .info .t,.sg .c,.akkoordlijn{ color:#000; }
  .sectie-kop{ color:#000; } .info .r{ color:#333; }
  .printpagina + .printpagina{ page-break-before:always; }
  .lijn{ page-break-inside:avoid; }
}
</style>
</head>
<body>
<div id="app">
  <header class="kop">
    <button class="ib" id="kLib" aria-label="Bibliotheek">☰</button>
    <button class="titelknop" id="kTitel"><span class="t" id="tTitel">Songtool</span><span class="m" id="tMeta"></span></button>
    <span class="dot" id="syncDot" title="Niet gesynchroniseerd"></span>
    <button class="modus" id="kModus">Weergave</button>
    <button class="ib" id="kMenu" aria-label="Menu">⋯</button>
  </header>
  <div class="balk" id="balk"></div>
  <main>
    <textarea id="editor" spellcheck="false" autocapitalize="sentences" placeholder="Typ je tekst. {Verse} voor een sectie, [Am] vóór de lettergreep voor een akkoord."></textarea>
    <div id="weergave" class="verborgen"></div>
  </main>
</div>

<div class="scherm verborgen" id="scherm-lib"></div>
<aside class="lade links" id="lib">
  <div class="lade-kop"><b>Bibliotheek</b><button class="plat" id="kOrden">Ordenen</button><button class="ib" id="kLibDicht" aria-label="Sluiten">✕</button></div>
  <div class="lade-zoek"><input type="search" id="zoek" placeholder="Zoek op titel of tekst"></div>
  <div class="lade-lijst" id="libLijst"></div>
  <div class="lade-voet"><button id="kNieuwNummer">＋ Nummer</button><button id="kNieuwAlbum">＋ Album</button></div>
</aside>

<div class="scherm verborgen" id="scherm-frag"></div>
<aside class="lade rechts" id="frag">
  <div class="lade-kop"><b>Fragmenten</b><button class="plat" id="kOpname" title="Voice memo opnemen">🎙</button><button class="plat" id="kNieuwFrag">＋ Nieuw</button><button class="ib" id="kFragDicht" aria-label="Sluiten">✕</button></div>
  <div class="lade-zoek"><input type="search" id="fragZoek" placeholder="Zoek in fragmenten"></div>
  <div class="filters" id="fragFilters"></div>
  <div class="lade-lijst" id="fragLijst"></div>
</aside>

<div class="scherm verborgen" id="scherm-vel"></div>
<section class="vel" id="vel"><div class="vel-kop"><b id="velTitel"></b><button class="ib" id="kVelDicht" aria-label="Sluiten">✕</button></div><div class="vel-inhoud" id="velInhoud"></div></section>

<div id="printvak"></div>
<input type="file" id="bestandTxt" accept=".txt,.cho,.chopro,text/plain" class="verborgen">
<input type="file" id="bestandJson" accept=".json,application/json" class="verborgen">

<script>
'use strict';
/* =====================================================================
   Songtool — tekst, akkoorden, fragmenten; live tussen toestellen via Dropbox;
   samen met Songtool Studio (opnames, mix, drums) op de laptop.
   Gewone JavaScript zonder bouwstap, getest voor Safari 15 (iPad Air 2).
   ===================================================================== */

// Dropbox-app (PKCE, geen geheim nodig). Ingevuld na het aanmaken van de app; kan ook per toestel in 'Synchronisatie'.
var DROPBOX_APP_KEY = 'elals0a8q81c5l1';

var LIB_KEY = 'songtool_library_v1', FRAG_KEY = 'songtool_fragments_v1', META_KEY = 'songtool_meta_v2',
    AUTH_KEY = 'songtool_dropbox_v1', STUDIO_KEY = 'songtool_studio_v1', UI_KEY = 'songtool_ui_v1', MEMO_KEY = 'songtool_memos_v1';
var SECTIES = ['Intro', 'Verse', 'Pre-chorus', 'Chorus', 'Refrain', 'Bridge', 'Solo', 'Intermezzo', 'Ref-riff', 'Outro'];

// ---------- hulpjes ----------
function $(id){ return document.getElementById(id); }
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'tekst') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'klasse') e.className = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (kids || []).forEach(function(c){ if (c !== null && c !== undefined && c !== false) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function genId(p){ return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function norm(s){ return String(s || '').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]/g,''); }
function lsGet(k, fallback){ try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fallback; } catch (e) { return fallback; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
var toastTimer = null;
function toast(t){
  var d = document.querySelector('.toast'); if (d) d.remove();
  d = el('div', { klasse: 'toast', tekst: t }); document.body.appendChild(d);
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ d.remove(); }, 2600);
}
function vandaag(){ var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function wanneer(ms){
  if (!ms) return 'nooit';
  var s = Math.round((Date.now() - ms) / 1000);
  if (s < 10) return 'zonet'; if (s < 60) return s + ' s geleden'; if (s < 3600) return Math.round(s/60) + ' min geleden';
  return new Date(ms).toLocaleString('nl-BE', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

// ---------- gegevens ----------
// db = { albums:[{id,name,songIds,updated}], songs:{id:{id,title,key,bpm,lyrics,updated,versies}}, fragments:[...],
//        deleted:{id:ms}, albumsOrderAt:ms }   (zelfde vorm als vroeger, met tijdstempels erbij)
var db, meta, ui;
function laadDb(){
  var lib = lsGet(LIB_KEY, null), fr = lsGet(FRAG_KEY, null);
  var d = (lib && Array.isArray(lib.albums) && lib.songs && typeof lib.songs === 'object') ? lib : { albums: [], songs: {} };
  d.fragments = (fr && Array.isArray(fr.fragments)) ? fr.fragments : (d.fragments || []);
  d.deleted = d.deleted || {};
  d.albumsOrderAt = d.albumsOrderAt || 0;
  d.albums.forEach(function(a){ a.songIds = a.songIds || []; a.updated = a.updated || 0; });
  Object.keys(d.songs).forEach(function(id){ var s = d.songs[id]; s.id = id; s.updated = s.updated || 0; });
  d.fragments.forEach(function(f){ f.updated = f.updated || 0; f.tags = f.tags || { type: [], sfeer: [], stanza: [] }; });
  return d;
}
function bewaarLokaal(){
  var lib = { albums: db.albums, songs: db.songs, deleted: db.deleted, albumsOrderAt: db.albumsOrderAt };
  var ok = lsSet(LIB_KEY, lib) && lsSet(FRAG_KEY, { fragments: db.fragments });
  if (!ok) toast('Opslaan in deze browser lukt niet (privévenster?). Maak een back-up.');
}
function bewaarMeta(){ lsSet(META_KEY, meta); }
var wijzigTimer = null;
// elke wijziging: lokaal bewaren en (vertraagd) synchroniseren
function gewijzigd(){
  meta.seq = (meta.seq || 0) + 1; meta.dirty = true; bewaarMeta();
  clearTimeout(wijzigTimer);
  wijzigTimer = setTimeout(function(){ bewaarLokaal(); sync(); }, 1200);
}
function stempel(oud){ return Math.max(Date.now(), (oud || 0) + 1); }   // altijd nieuwer dan de versie waarop je verder werkte
function songInhoud(s){ return [s.title || '', s.key || '', s.bpm || '', s.lyrics || ''].join('\u0001'); }

// ---------- akkoorden: lezen, transponeren, weergeven ----------
var NOTEN_KRUIS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], NOTEN_MOL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var NOOT = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5, 'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11, Cb:11, 'E#':5, Fb:4, 'B#':0 };
function transponeerNoot(n, st, mol){ var i = NOOT[n]; if (i === undefined) return n; return (mol ? NOTEN_MOL : NOTEN_KRUIS)[(i + st + 120) % 12]; }
function transponeer(akk, st){
  if (!st) return akk;
  // werkt ook voor 'Bm A x2', 'C#m7/G#', 'F#m E'
  return akk.replace(/(^|[\s\/(|])([A-G][#b]?)/g, function(m, voor, n){ return voor + transponeerNoot(n, st, n.length > 1 && n[1] === 'b'); });
}
function eersteLaatste(tekst){
  var m = (tekst || '').match(/\[([^\]]+)\]/g) || [];
  if (!m.length) return { eerste: null, laatste: null };
  var a = m[0].slice(1,-1).trim().split(/\s+/)[0], z = m[m.length-1].slice(1,-1).trim().split(/\s+/); z = z[z.length-1];
  return { eerste: a, laatste: z };
}
function gebruikteAkkoorden(tekst){
  var gezien = {}, uit = [];
  ((tekst || '').match(/\[([^\]]+)\]/g) || []).forEach(function(m){
    m.slice(1,-1).trim().split(/\s+/).forEach(function(a){ if (/^[A-G]/.test(a) && !gezien[a]) { gezien[a] = 1; uit.push(a); } });
  });
  return uit;
}
// één regel -> stukjes (akkoord + tekst); elk woord apart zodat lange regels netjes omlopen
function lijnHtml(raw, st){
  var re = /\[([^\]]*)\]/g, stukken = [], laatste = 0, m, akk = '';
  while ((m = re.exec(raw)) !== null) {
    stukken.push({ c: akk, t: raw.slice(laatste, m.index) });
    akk = transponeer(m[1].trim(), st); laatste = re.lastIndex;
  }
  stukken.push({ c: akk, t: raw.slice(laatste) });
  var heeftAkk = stukken.some(function(s){ return s.c; });
  var heeftTekst = stukken.some(function(s){ return s.t.trim(); });
  if (heeftAkk && !heeftTekst) return '<div class="akkoordlijn">' + esc(stukken.map(function(s){ return s.c; }).filter(Boolean).join('   ')) + '</div>';
  var html = '';
  stukken.forEach(function(s, i){
    if (!s.c && !s.t) return;
    var woorden = s.t.match(/\S+\s*|\s+/g) || [''];
    woorden.forEach(function(w, k){
      var c = k === 0 ? s.c : '';
      html += '<span class="sg"><span class="c">' + (c ? esc(c) : '&nbsp;') + '</span>' + (esc(w) || (c ? ' ' : '')) + '</span>';
    });
  });
  return '<div class="lijn' + (heeftAkk ? '' : ' zonder') + '">' + html + '</div>';
}
function bladHtml(song, st){
  var tekst = song.lyrics || '', el1 = eersteLaatste(tekst);
  var info = '<div class="info"><div class="t">' + esc(song.title || '(naamloos)') + '</div><div class="r">' +
    'Toonaard: ' + esc(st ? transponeer(song.key || '–', st) : (song.key || '–')) + ' · BPM: ' + esc(song.bpm || '–') +
    ' · Eerste akkoord: ' + esc(el1.eerste ? transponeer(el1.eerste, st) : '–') + ' · Laatste: ' + esc(el1.laatste ? transponeer(el1.laatste, st) : '–') +
    (st ? ' · getransponeerd ' + (st > 0 ? '+' : '') + st : '') + '</div></div>';
  var html = '<div class="blok">';
  tekst.replace(/\r\n/g, '\n').split('\n').forEach(function(raw){
    var t = raw.trim();
    if (!t) { html += '<div class="wit"></div>'; return; }
    var sec = t.match(/^\{([^:}]+)\}$/);
    if (sec) { html += '</div><div class="blok"><div class="sectie-kop">' + esc(sec[1]) + '</div>'; return; }
    var c = t.match(/^\{c:\s*(.*)\}$/i);
    if (c) { html += '<div class="notitie">' + esc(c[1]) + '</div>'; return; }
    html += lijnHtml(raw, st);
  });
  return '<div class="blad">' + info + html + '</div></div>';
}

// ---------- huidige song, editor en weergave ----------
var editor = $('editor'), weergave = $('weergave'), balk = $('balk');
var huidigId = null, modus = 'bewerk', caret = 0, laatsteTyp = 0, ordenen = false;
function huidig(){ return huidigId ? db.songs[huidigId] : null; }
function albumVan(id){ for (var i = 0; i < db.albums.length; i++) if (db.albums[i].songIds.indexOf(id) >= 0) return db.albums[i]; return null; }
function eersteSong(){ for (var i = 0; i < db.albums.length; i++) if (db.albums[i].songIds.length) return db.albums[i].songIds[0]; var k = Object.keys(db.songs); return k[0] || null; }

function openSong(id, behoudModus){
  if (id && !db.songs[id]) id = null;
  huidigId = id; ui.laatste = id; lsSet(UI_KEY, ui);
  var s = huidig();

  if (!behoudModus && s && !(s.lyrics || '').trim()) zetModus('bewerk');

}
function toonKop(){
  var s = huidig();
  $('tTitel').textContent = s ? (s.title || '(naamloos)') : 'Songtool';
  var m = [];
  if (s) { if (s.key) m.push(s.key); if (s.bpm) m.push(s.bpm + ' BPM'); var a = albumVan(s.id); if (a) m.push(a.name); if (studioVersies(s).length) m.push('🎛 studio'); }

  $('kModus').textContent = modus === 'bewerk' ? 'Weergave' : 'Bewerk';
  $('kModus').classList.toggle('aan', modus === 'weergave');
}
function zetModus(m){
  modus = m;
  editor.classList.toggle('verborgen', m !== 'bewerk' || !huidig());
  weergave.classList.toggle('verborgen', m === 'bewerk' && !!huidig());
  if (m === 'bewerk') editor.blur();
  toonKop(); toonBalk(); toonWeergave();
}
function toonWeergave(){
  var s = huidig();
  editor.classList.toggle('verborgen', modus !== 'bewerk' || !s);
  weergave.classList.toggle('verborgen', !(modus === 'weergave' || !s));
  if (!s) {
    weergave.innerHTML = '';
    var leeg = el('div', { klasse: 'leeg' }, [
      el('p', { tekst: Object.keys(db.songs).length ? 'Kies een nummer in je bibliotheek.' : 'Nog geen nummers op dit toestel.' }),
      el('button', { klasse: 'primair', tekst: '☰ Bibliotheek', onclick: function(){ openLade('lib'); } }),
      !Object.keys(db.songs).length ? el('button', { tekst: '☁ Synchroniseren met Dropbox', onclick: toonSync }) : null,
      !Object.keys(db.songs).length ? el('button', { tekst: 'Back-up importeren', onclick: function(){ $('bestandJson').click(); } }) : null]);
    weergave.appendChild(leeg);
    return;
  }
  if (modus !== 'weergave') return;
  weergave.classList.toggle('passend', !!ui.passend);
  weergave.style.setProperty('--schaal', ui.passend ? 1 : schaal());
  weergave.innerHTML = bladHtml(s, ui.transpose || 0);
  if (ui.passend) pasIn();
}
function schaal(){ return ui.schaal || (window.innerWidth >= 700 ? 1.15 : 1); }   // op een iPad standaard iets groter
// Passend: de hele song op het scherm, zo groot mogelijk, in 1 tot 3 kolommen (iPad als muziekstandaard)
function pasIn(){
  var blad = weergave.querySelector('.blad'); if (!blad) return;
  weergave.style.overflow = '';            // schuifbalk van de vorige song mag de meting niet storen
  var hoog = weergave.clientHeight - 24, breed = weergave.clientWidth - 32, beste = null;
  for (var k = 1; k <= 3; k++) {
    if (k > 1 && breed / k < 260) break;
    blad.style.columnCount = k;
    var lo = 0.55, hi = 2.2;
    for (var i = 0; i < 9; i++) {                       // binair zoeken naar de grootste lettergrootte die past
      var mid = (lo + hi) / 2; weergave.style.setProperty('--schaal', mid);
      if (blad.scrollHeight <= hoog && blad.scrollWidth <= breed + 2) lo = mid; else hi = mid;
    }
    if (!beste || lo > beste.s * 1.08) beste = { k: k, s: lo };   // meer kolommen enkel als het duidelijk groter wordt
  }
  // nooit kleiner dan 14 px: dan liever een beetje scrollen dan onleesbaar
  var MIN = 14 / 17;
  if (beste.s < MIN) beste = { k: 1, s: MIN };   // kolommen die je moet scrollen lezen niet: dan één kolom
  blad.style.columnCount = beste.k;
  weergave.style.setProperty('--schaal', beste.s);
  weergave.style.overflow = blad.scrollHeight > hoog + 24 ? 'auto' : '';
}
window.addEventListener('resize', function(){ if (modus === 'weergave' && ui.passend) pasIn(); });

editor.addEventListener('input', function(){
  var s = huidig(); if (!s) return;
  s.lyrics = editor.value; s.updated = stempel(s.updated); laatsteTyp = Date.now();
  caret = editor.selectionStart;
  gewijzigd(); toonBalkAkkoorden();
});
['keyup','click','select','blur'].forEach(function(ev){ editor.addEventListener(ev, function(){ caret = editor.selectionStart; }); });

// invoegen op de laatst gekende cursorplek (ook na tikken op een knop, waarbij het tekstvak de focus verliest)
function voegIn(tekst, regelbegin){
  var s = huidig(); if (!s) return;
  var v = editor.value, p = Math.min(caret, v.length);
  if (regelbegin) {
    var begin = v.lastIndexOf('\n', p - 1) + 1;
    if (v.slice(begin, p).trim()) { tekst = '\n' + tekst; } else p = begin;
  }
  editor.value = v.slice(0, p) + tekst + v.slice(p);
  caret = p + tekst.length;
  editor.focus(); editor.setSelectionRange(caret, caret);
  s.lyrics = editor.value; s.updated = stempel(s.updated); gewijzigd(); toonBalkAkkoorden();
}

// werkbalk: in bewerkmodus secties en akkoorden, in weergave transponeren en lettergrootte
function toonBalk(){
  balk.innerHTML = '';
  var s = huidig();
  balk.classList.toggle('verborgen', !s);
  if (!s) return;
  if (modus === 'bewerk') {
    balk.appendChild(el('button', { klasse: 'chip sectie acc', tekst: '{ } Sectie', onclick: kiesSectie }));
    var invoer = el('input', { type: 'text', placeholder: '+ akkoord', autocapitalize: 'characters', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'done' });
    invoer.addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); var a = invoer.value.trim().replace(/[\[\]]/g, ''); if (a) { invoer.value = ''; voegIn('[' + a + ']'); } }
    });
    balk.appendChild(invoer);
    var vak = el('span', { id: 'akkVak', style: 'display:flex;gap:6px;flex:none' });
    balk.appendChild(vak);
    toonBalkAkkoorden();
  } else {
    var tr = ui.transpose || 0;
    function zetTr(d){ ui.transpose = tr + d; toonWeergave(); toonBalk(); }
    balk.appendChild(el('button', { klasse: 'chip sectie', tekst: '−', title: 'Halve toon lager', onclick: function(){ zetTr(-1); } }));
    balk.appendChild(el('span', { klasse: 'toon' + (tr ? ' acc' : ''), title: 'Toonaard (transponeren met − en +)',
      tekst: s.key ? transponeer(s.key, tr) : (tr ? (tr > 0 ? '+' : '') + tr : 'Toon') }));
    balk.appendChild(el('button', { klasse: 'chip sectie', tekst: '+', title: 'Halve toon hoger', onclick: function(){ zetTr(1); } }));
    if (tr) balk.appendChild(el('button', { klasse: 'chip sectie', tekst: '↺', title: 'Terug naar de oorspronkelijke toonaard', onclick: function(){ zetTr(-tr); } }));
    balk.appendChild(el('button', { klasse: 'chip sectie' + (ui.passend ? ' aan' : ''), tekst: '⤢ Passend', title: 'De hele song op het scherm', onclick: function(){
      ui.passend = !ui.passend; lsSet(UI_KEY, ui); if (scrollTimer) wisselScroll(); toonWeergave(); toonBalk(); } }));
    if (!ui.passend) {
      balk.appendChild(el('button', { klasse: 'chip sectie', tekst: 'A−', onclick: function(){ ui.schaal = Math.max(0.7, schaal() - 0.1); lsSet(UI_KEY, ui); toonWeergave(); } }));
      balk.appendChild(el('button', { klasse: 'chip sectie', tekst: 'A+', onclick: function(){ ui.schaal = Math.min(2.2, schaal() + 0.1); lsSet(UI_KEY, ui); toonWeergave(); } }));
      balk.appendChild(el('button', { klasse: 'chip sectie', id: 'kScroll', tekst: scrollTimer ? '■ Stop' : '▶ Scroll', onclick: wisselScroll }));
    }
    if (studioVersies(s).length) balk.appendChild(el('button', { klasse: 'chip sectie acc', tekst: '🎛 Studio', onclick: toonStudio }));
  }
}
function toonBalkAkkoorden(){
  var vak = $('akkVak'); if (!vak) return;
  vak.innerHTML = '';
  gebruikteAkkoorden(editor.value).forEach(function(a){
    vak.appendChild(el('button', { klasse: 'chip', tekst: a, onmousedown: function(e){ e.preventDefault(); }, onclick: function(){ voegIn('[' + a + ']'); } }));
  });
}
function kiesSectie(){
  var gebruikt = ((editor.value.match(/^\s*\{([^:}]+)\}\s*$/gm)) || []).map(function(x){ return x.trim().slice(1,-1); });
  var namen = []; gebruikt.concat(SECTIES).forEach(function(n){ if (namen.indexOf(n) < 0) namen.push(n); });
  var vrij = el('input', { type: 'text', placeholder: 'Eigen naam' });
  openVel('Sectie invoegen', [
    el('div', { klasse: 'statuschips' }, namen.map(function(n){ return el('button', { klasse: 'chip sectie', tekst: n, onclick: function(){ sluitVel(); voegIn('{' + n + '}\n', true); } }); })),
    el('div', { klasse: 'rij' }, [vrij, el('button', { klasse: 'primair', tekst: 'Invoegen', style: 'flex:none', onclick: function(){ if (vrij.value.trim()) { sluitVel(); voegIn('{' + vrij.value.trim() + '}\n', true); } } })]),
    el('p', { klasse: 'zacht klein', tekst: 'Notitie boven een regel: {c: zacht, fingerpicked}' })]);
}

  e.preventDefault(); caret = editor.selectionStart;

// automatisch scrollen in de weergave (om mee te spelen)
var scrollTimer = null;
function wisselScroll(){
  if (scrollTimer) { clearInterval(scrollTimer); scrollTimer = null; }
  else {
    var s = huidig(), bpm = parseFloat(s && s.bpm) || 90;
    scrollTimer = setInterval(function(){
      weergave.scrollTop += 1;
      if (weergave.scrollTop + weergave.clientHeight >= weergave.scrollHeight - 2) wisselScroll();
    }, Math.max(25, 5200 / bpm));
  }
  var k = $('kScroll'); if (k) k.textContent = scrollTimer ? '■ Stop' : '▶ Scroll';
}

function toonSonginfo(){
  var s = huidig(); if (!s) return;
  var t = el('input', { type: 'text', value: s.title || '' }), k = el('input', { type: 'text', value: s.key || '', placeholder: 'bv. Am' }),
      b = el('input', { type: 'number', inputmode: 'decimal', value: s.bpm || '', placeholder: 'bv. 96' });

  var el1 = eersteLaatste(s.lyrics);
  function bewaar(){
    s.title = t.value; s.key = k.value.trim(); s.bpm = b.value.trim(); s.updated = stempel(s.updated);
    var oud = albumVan(s.id), nieuw = db.albums.filter(function(a){ return a.id === albumSel.value; })[0];
    if (nieuw && oud !== nieuw) { verplaatsNaarAlbum(s.id, nieuw); }

  }
  openVel('Songinfo', [
    el('label', { klasse: 'veld' }, [el('span', { tekst: 'Titel' }), t]),
    el('div', { klasse: 'rij' }, [el('label', { klasse: 'veld' }, [el('span', { tekst: 'Toonaard' }), k]), el('label', { klasse: 'veld' }, [el('span', { tekst: 'BPM' }), b])]),
    db.albums.length > 1 ? el('label', { klasse: 'veld' }, [el('span', { tekst: 'Album' }), albumSel]) : null,
    el('p', { klasse: 'zacht klein', tekst: 'Eerste akkoord: ' + (el1.eerste || '–') + ' · laatste akkoord: ' + (el1.laatste || '–') }),
    el('div', { klasse: 'knoppen' }, [el('button', { klasse: 'primair', tekst: 'Bewaren', onclick: bewaar }),
      (s.versies && s.versies.length) ? el('button', { tekst: 'Vorige versie van de tekst…', onclick: toonVersies }) : null,
      el('button', { klasse: 'gevaar', tekst: 'Nummer verwijderen', onclick: function(){ sluitVel(); verwijderSong(s.id); } })])]);

function toonVersies(){
  var s = huidig(); if (!s || !s.versies) return;
  openVel('Vorige versies', s.versies.slice().reverse().map(function(v){
    return el('div', { klasse: 'studio-versie' }, [el('b', { tekst: wanneer(v.tijd) + (v.reden ? ' · ' + v.reden : '') }),
      el('div', { klasse: 'mini-blad zacht', tekst: (v.lyrics || '').slice(0, 400) + ((v.lyrics || '').length > 400 ? '…' : '') }),
      el('button', { tekst: 'Deze versie terugzetten', onclick: function(){ zetTekst(s, v.lyrics, 'teruggezet'); sluitVel(); toast('Teruggezet'); } })]);
  }));

// tekst vervangen met een vorige versie als vangnet
function zetTekst(s, tekst, reden){
  s.versies = (s.versies || []).concat([{ tijd: Date.now(), lyrics: s.lyrics || '', reden: reden }]).slice(-10);
  s.lyrics = tekst; s.updated = stempel(s.updated);
  if (s.id === huidigId) editor.value = tekst;
  gewijzigd(); toonWeergave(); toonBalk();
}

function schuifSong(a, i, d){

  a.updated = stempel(a.updated); gewijzigd(); renderLib();
}
function schuifAlbum(i, d){

  var x = db.albums[i]; db.albums[i] = db.albums[j]; db.albums[j] = x;

function verwijderAlbum(a){

// ---------- voice memo's: opnemen, bewaren (ook offline), naar Dropbox, omgezet door de Studio ----------
// Het geluid staat eerst in deze browser (IndexedDB) en gaat bij het synchroniseren naar Dropbox › memos/<id>.
// De Studio op de laptop zet het om naar woorden en muziek en schrijft het resultaat in memos.json.
var memoInfo = null, memoTransp = {};
function duurTekst(s){ s = Math.round(s || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function idb(){
  return new Promise(function(ok, nok){
    var r = indexedDB.open('songtool', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('memos'); };
    r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ nok(r.error); };
  });
}
function idbDoe(modus, actie){
  return idb().then(function(d){ return new Promise(function(ok, nok){
    var tx = d.transaction('memos', modus), st = tx.objectStore('memos'), r = actie(st);
    tx.oncomplete = function(){ ok(r && r.result); }; tx.onerror = function(){ nok(tx.error); };
  }); });
}
function memoBewaar(id, w){ return idbDoe('readwrite', function(st){ return st.put(w, id); }); }
function memoHaal(id){ return idbDoe('readonly', function(st){ return st.get(id); }); }
function memoAlle(){ return idbDoe('readonly', function(st){ return st.getAllKeys(); }); }
function memoResultaat(x){ return memoInfo && memoInfo.memos ? memoInfo.memos[x.id] : null; }

var opname = null;
function opnemen(bestaand){
  if (!window.MediaRecorder || !navigator.mediaDevices) { alert('Opnemen werkt niet in deze browser. Kies dan een bestaand geluidsbestand (bv. uit Dictafoon).'); return kiesMemoBestand(bestaand); }
  var klok = el('div', { style: 'font-size:44px;text-align:center;font-family:var(--mono);margin:16px 0', tekst: '0:00' });
  var info = el('p', { klasse: 'zacht klein', style: 'text-align:center', tekst: 'Toegang tot de microfoon vragen…' });
  var stop = el('button', { klasse: 'primair', style: 'width:100%;padding:14px;font-size:18px', tekst: '■ Stop en bewaar', disabled: 'disabled' });
  openVel('🎙 Voice memo', [klok, info, stop, el('div', { klasse: 'knoppen' }, [el('button', { tekst: 'Annuleren', onclick: function(){ if (opname) { opname.annuleer = true; opname.rec.stop(); } sluitVel(); } }),
    el('button', { tekst: 'Of kies een bestand…', onclick: function(){ if (opname) { opname.annuleer = true; opname.rec.stop(); } sluitVel(); kiesMemoBestand(bestaand); } })])]);
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function(stream){
    var type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].filter(function(t){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0] || '';
    var rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined), stukken = [], t0 = Date.now();
    opname = { rec: rec, annuleer: false };
    rec.ondataavailable = function(e){ if (e.data && e.data.size) stukken.push(e.data); };
    var timer = setInterval(function(){ klok.textContent = duurTekst((Date.now() - t0) / 1000); }, 250);
    rec.onstop = function(){
      clearInterval(timer); stream.getTracks().forEach(function(tr){ tr.stop(); });
      var a = opname; opname = null;
      if (a.annuleer) return;
      var mime = rec.mimeType || type || 'audio/mp4';
      bewaarMemo(new Blob(stukken, { type: mime }), mime, (Date.now() - t0) / 1000, bestaand);
    };
    rec.start(1000);
    info.textContent = 'Opname loopt. Zing, speel of spreek je idee in.';
    stop.removeAttribute('disabled');
    stop.onclick = function(){ rec.stop(); sluitVel(); };
  }, function(e){
    info.textContent = 'Geen toegang tot de microfoon (' + (e && e.name || 'geweigerd') + '). Sta het toe in de instellingen van je browser, of kies een bestaand bestand.';
  });
}
function kiesMemoBestand(bestaand){
  var inp = el('input', { type: 'file', accept: 'audio/*,.m4a,.mp3,.wav,.aac,.caf' });
  inp.addEventListener('change', function(){
    var f = inp.files[0]; if (!f) return;
    var a = new Audio(); a.preload = 'metadata';
    a.onloadedmetadata = function(){ bewaarMemo(f, f.type || 'audio/mp4', isFinite(a.duration) ? a.duration : 0, bestaand, f.name); };
    a.onerror = function(){ bewaarMemo(f, f.type || 'audio/mp4', 0, bestaand, f.name); };
    a.src = URL.createObjectURL(f);
  });
  inp.click();
}
function extVoor(mime, naam){
  var m = (naam || '').match(/\.(m4a|mp3|wav|aac|caf|webm|ogg|aiff?)$/i);
  if (m) return m[1].toLowerCase();
  return /webm/.test(mime) ? 'webm' : (/ogg/.test(mime) ? 'ogg' : (/wav/.test(mime) ? 'wav' : (/mpeg/.test(mime) ? 'mp3' : 'm4a')));
}
function bewaarMemo(blob, mime, duur, bestaand, naam){
  var id = bestaand ? bestaand.id : genId('frag'), ext = extVoor(mime, naam);
  var info = { pad: '/memos/' + id + '.' + ext, type: mime, duur: Math.round(duur * 10) / 10, opgenomen: Date.now() };
  memoBewaar(id, { blob: blob, type: mime, geupload: false, pad: info.pad }).then(function(){
    if (bestaand) { bestaand.memo = info; bestaand.updated = stempel(bestaand.updated); }
    else db.fragments.unshift({ id: id, created: Date.now(), text: '', tags: { type: ['memo'], sfeer: [], stanza: [] }, memo: info, updated: Date.now() });
    gewijzigd(); renderFrag();
    toast(verbonden() ? 'Memo bewaard: de laptop zet het om naar woorden en muziek' : 'Memo bewaard op dit toestel');
  }, function(){ alert('Bewaren in deze browser lukt niet (privévenster?).'); });
}
// in sync(): nog niet geüploade memo's naar Dropbox
function uploadMemos(){
  return memoAlle().then(function(ids){
    var keten = Promise.resolve();
    (ids || []).forEach(function(id){
      keten = keten.then(function(){ return memoHaal(id); }).then(function(w){
        if (!w || w.geupload) return;
        return zetBestand(w.pad, w.blob, { '.tag': 'overwrite' }).then(function(){ w.geupload = true; return memoBewaar(id, w); });
      });
    });
    return keten;
  }).catch(function(e){ if (e && e.status) throw e; });   // geen IndexedDB: niets te doen
}
function noteTransp(n, st){
  var m = n.match(/^([A-G][#b]?)(-?\d)$/); if (!m || !st) return n;
  var i = NOOT[m[1]] + st, oct = parseInt(m[2], 10) + Math.floor(i / 12);
  return transponeerNoot(m[1], st, m[1].length > 1 && m[1][1] === 'b') + oct;
}
function toonaardKort(t){ if (!t) return ''; var d = t.split(' '); return d[0] + (d[1] && d[1].indexOf('min') === 0 ? 'm' : ''); }
function memoBlok(x){
  var r = memoResultaat(x) || {}, st = memoTransp[x.id] || 0;

  blok.appendChild(kop); blok.appendChild(speler);

    blok.appendChild(st2);

    r.tempo ? el('span', { klasse: 'sc', tekst: '± ' + r.tempo + ' BPM' }) : null,
    el('span', { klasse: 'sc', tekst: wat.length ? wat.join(' + ') : 'niets herkend' }),
    st ? el('span', { klasse: 'sc oud', tekst: 'getransponeerd ' + (st > 0 ? '+' : '') + st }) : null]));
  var trans = function(d){ memoTransp[x.id] = (memoTransp[x.id] || 0) + d; renderFrag(); };

    el('button', { klasse: 'chip sectie', tekst: '− ½', onclick: function(){ trans(-1); } }),
    el('span', { klasse: 'zacht klein', style: 'align-self:center', tekst: 'transponeer' }),
    el('button', { klasse: 'chip sectie', tekst: '+ ½', onclick: function(){ trans(1); } })]));

    var mel = el('div', { klasse: 'melodie' }, [el('span', { klasse: 'zacht klein', tekst: 'Melodie (experimenteel): ' }), document.createTextNode(noten.slice(0, 24).join(' ') + (kort ? ' …' : ''))]);
    if (kort) mel.appendChild(el('button', { klasse: 'plat klein', tekst: 'alles tonen', onclick: function(){ mel.lastChild.remove(); mel.lastChild.textContent = noten.join(' '); } }));
    blok.appendChild(mel);
  }

// ---------- samenvoegen (zelfde nummer op twee toestellen gewijzigd) ----------
function normaliseer(d){
  d = JSON.parse(JSON.stringify(d));

  d.songs = d.songs || {}; Object.keys(d.songs).forEach(function(id){ d.songs[id].id = id; d.songs[id].updated = d.songs[id].updated || 0; });
  d.fragments = d.fragments || []; d.fragments.forEach(function(f){ f.updated = f.updated || 0; f.tags = f.tags || { type: [], sfeer: [], stanza: [] }; });
  d.deleted = d.deleted || {}; d.albumsOrderAt = d.albumsOrderAt || 0;
  return d;
}
function exportVorm(d){
  return { formaat: 2, app: 'Songtool', bijgewerkt: Date.now(), albums: d.albums, songs: d.songs, fragments: d.fragments,

// Per nummer, album en fragment wint de nieuwste versie. Zonder tijdstempel (oude gegevens) en met een andere
// inhoud blijven ze allebei bestaan ("kopie"), zodat er nooit tekst verloren gaat.
function voegSamen(lok, ver, bewaarBeide){
  var uit = { albums: [], songs: {}, fragments: [], deleted: {}, albumsOrderAt: Math.max(lok.albumsOrderAt || 0, ver.albumsOrderAt || 0) };
  Object.keys(lok.deleted).concat(Object.keys(ver.deleted)).forEach(function(id){ uit.deleted[id] = Math.max(lok.deleted[id] || 0, ver.deleted[id] || 0); });
  var kopieen = [];
  var ids = {}; Object.keys(lok.songs).concat(Object.keys(ver.songs)).forEach(function(id){ ids[id] = 1; });
  Object.keys(ids).forEach(function(id){
    var a = lok.songs[id], b = ver.songs[id], w;
    if (a && b) {
      if (songInhoud(a) === songInhoud(b)) w = (a.updated || 0) >= (b.updated || 0) ? a : b;
      else if ((a.updated || 0) === (b.updated || 0) || bewaarBeide) {
        w = (a.updated || 0) >= (b.updated || 0) ? a : b;
        var ander = w === a ? b : a, kid = genId('song');
        if (!(a.updated || b.updated) || bewaarBeide) kopieen.push({ id: kid, van: id, song: Object.assign({}, ander, { id: kid, title: (ander.title || 'naamloos') + ' (kopie)', updated: Date.now() }) });
      } else w = a.updated > b.updated ? a : b;
    } else w = a || b;
    if ((uit.deleted[id] || 0) >= (w.updated || 0) && uit.deleted[id]) return;
    uit.songs[id] = w;
  });
  var aid = {}; lok.albums.concat(ver.albums).forEach(function(a){ aid[a.id] = 1; });
  var albums = {};
  Object.keys(aid).forEach(function(id){
    var a = lok.albums.filter(function(x){ return x.id === id; })[0], b = ver.albums.filter(function(x){ return x.id === id; })[0];
    var w = a && b ? ((a.updated || 0) >= (b.updated || 0) ? a : b) : (a || b);
    if (a && b) {   // nummers van beide kanten houden (verplaatst = staat in een ander album; dat lost de stap hieronder op)
      var l = w === a ? b : a, ex = l.songIds.filter(function(s){ return w.songIds.indexOf(s) < 0; });
      w = Object.assign({}, w, { songIds: w.songIds.concat(ex), _extra: ex });
    }
    if (uit.deleted[id] && uit.deleted[id] >= (w.updated || 0)) return;
    albums[id] = Object.assign({}, w, { songIds: w.songIds.slice() });
  });
  var volgorde = ((lok.albumsOrderAt || 0) >= (ver.albumsOrderAt || 0) ? lok.albums.concat(ver.albums) : ver.albums.concat(lok.albums)).map(function(a){ return a.id; });
  var gezienA = {};
  volgorde.forEach(function(id){ if (albums[id] && !gezienA[id]) { gezienA[id] = 1; uit.albums.push(albums[id]); } });
  // elk nummer in precies één album (het recentst gewijzigde album wint)
  // eerst de eigen lijst van elk album (nieuwste album eerst), pas daarna nummers die enkel aangevuld werden
  var plek = {}, opVolgorde = uit.albums.slice().sort(function(a, b){ return (b.updated || 0) - (a.updated || 0); });
  opVolgorde.forEach(function(a){
    var extra = a._extra || [];
    a.songIds.forEach(function(sid){ if (extra.indexOf(sid) < 0 && uit.songs[sid] && !plek[sid]) plek[sid] = a.id; });
  });
  opVolgorde.forEach(function(a){ (a._extra || []).forEach(function(sid){ if (uit.songs[sid] && !plek[sid]) plek[sid] = a.id; }); });
  uit.albums.forEach(function(a){
    var gezien = {};
    a.songIds = a.songIds.filter(function(sid){ if (plek[sid] !== a.id || gezien[sid]) return false; gezien[sid] = 1; return true; });
    delete a._extra;
  });
  kopieen.forEach(function(k){
    uit.songs[k.id] = k.song;
    var a = uit.albums.filter(function(x){ return x.id === plek[k.van]; })[0];
    if (a) { a.songIds.splice(a.songIds.indexOf(k.van) + 1, 0, k.id); plek[k.id] = a.id; }
  });
  var los = Object.keys(uit.songs).filter(function(sid){ return !plek[sid]; });
  if (los.length) {
    var z = uit.albums.filter(function(x){ return x.id === 'album-zonder'; })[0];
    if (!z) { z = { id: 'album-zonder', name: 'Zonder album', songIds: [], updated: Date.now() }; uit.albums.push(z); }
    z.songIds = z.songIds.concat(los);
  }
  var fr = {}, frVolg = [];
  lok.fragments.concat(ver.fragments).forEach(function(f){
    if (!fr[f.id]) { frVolg.push(f.id); fr[f.id] = f; } else if ((f.updated || 0) > (fr[f.id].updated || 0)) fr[f.id] = f;
  });
  uit.fragments = frVolg.map(function(id){ return fr[id]; }).filter(function(f){ return !(uit.deleted[f.id] && uit.deleted[f.id] >= (f.updated || 0)); });
  return uit;
}
function canoniek(d){
  var songs = {}; Object.keys(d.songs).sort().forEach(function(id){ var s = d.songs[id]; songs[id] = [s.title, s.key, s.bpm, s.lyrics, s.updated]; });
  return JSON.stringify([d.albums.map(function(a){ return [a.id, a.name, a.songIds, a.updated]; }), songs,
    d.fragments.map(function(f){ return [f.id, f.updated]; }), Object.keys(d.deleted).sort().map(function(k){ return [k, d.deleted[k]]; })]);
}

// ---------- Dropbox-synchronisatie ----------

function argKop(o){ return JSON.stringify(o).replace(/[\u007f-\uffff]/g, function(c){ return '\\u' + ('0000' + c.charCodeAt(0).toString(16)).slice(-4); }); }

// Pas samengevoegde gegevens toe zonder je typen te storen.
function pasToe(nieuw){
  var oudHuidig = huidig(), oudeTekst = oudHuidig ? oudHuidig.lyrics : null;
  db = nieuw; bewaarLokaal();
  var s = huidig();
  if (!s) { openSong(eersteSong()); return; }
  if (s.lyrics !== oudeTekst && editor.value !== s.lyrics) {
    var p = editor.selectionStart; editor.value = s.lyrics || '';

function sync(){
  if (!verbonden() || !navigator.onLine) { zetDot(verbonden() ? 'bezig' : '', verbonden() ? 'Offline: wordt gesynchroniseerd zodra er internet is' : null); return Promise.resolve(); }
  if (syncBezig) { syncOpnieuw = true; return Promise.resolve(); }
  syncBezig = true; zetDot('bezig', 'Synchroniseren…');
  var poging = 0;
  function ronde(){
    poging++;
    return rpc('files/list_folder', { path: '' }).then(function(lijst){
      var f = zoekIn(lijst, 'songtool.json'), st = zoekIn(lijst, 'studio.json');
      var studioKlaar = (st && st.rev !== meta.studioRev) ? haalBestand('/studio.json').then(function(x){
        try { studio = JSON.parse(x); lsSet(STUDIO_KEY, studio); meta.studioRev = st.rev; toonKop(); renderLib(); if (modus === 'weergave') toonBalk(); } catch (e) { /* half geschreven: volgende keer */ }
      }) : Promise.resolve();
      var mj = zoekIn(lijst, 'memos.json');
      var memosKlaar = (mj && mj.rev !== meta.memosRev) ? haalBestand('/memos.json').then(function(x){
        try { memoInfo = JSON.parse(x); lsSet(MEMO_KEY, memoInfo); meta.memosRev = mj.rev; if ($('frag').classList.contains('open')) renderFrag(); } catch (e) { /* half geschreven */ }
      }) : Promise.resolve();
      var stap = poging === 1 ? uploadMemos() : Promise.resolve();
      if (f && f.rev !== meta.rev) {
        stap = stap.then(function(){ return haalBestand('/songtool.json'); }).then(function(x){
          var ver = normaliseer(JSON.parse(x)), voor = canoniek(db), samen = voegSamen(db, ver, false);
          if (canoniek(samen) !== voor) pasToe(samen);
          meta.rev = f.rev;
          if (canoniek(samen) !== canoniek(ver)) { meta.dirty = true; meta.seq = (meta.seq || 0) + 1; }
          else meta.dirty = false;
        });
      }
      return Promise.all([studioKlaar, memosKlaar, stap]).then(function(){
        if (!meta.dirty && f) return true;
        var seq = meta.seq, inhoud = JSON.stringify(exportVorm(db));
        return zetBestand('/songtool.json', inhoud, f ? { '.tag': 'update', update: f.rev } : { '.tag': 'add' }).then(function(res){
          meta.rev = res.rev; if (meta.seq === seq) meta.dirty = false; meta.laatsteSync = Date.now();
          if (meta.backupDag !== vandaag()) {
            meta.backupDag = vandaag();
            zetBestand('/backups/songtool-' + vandaag() + '.json', inhoud, { '.tag': 'overwrite' }).catch(function(){ meta.backupDag = null; });
          }
          return true;
        }, function(e){ if (e.status === 409 && poging < 4) return ronde(); throw e; });
      });
    });
  }
  return ronde().then(function(){
    syncFout = null; meta.laatsteSync = Date.now();
    zetDot('ok');
  }, function(e){
    syncFout = e.status === 401 ? 'toegang verlopen of ingetrokken: verbind opnieuw' : (navigator.onLine ? (e.message || 'onbekende fout').slice(0, 120) : 'offline');
    zetDot(navigator.onLine ? 'fout' : 'bezig', syncFout);

    syncBezig = false; bewaarMeta();
    if (syncOpnieuw) { syncOpnieuw = false; setTimeout(sync, 300); }
  });
}
setInterval(function(){ if (document.visibilityState === 'visible') sync(); }, 8000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') sync(); else if (meta.dirty) { bewaarLokaal(); sync(); } });

// verbinden: PKCE zonder terugstuuradres (Dropbox toont een code om te plakken; werkt ook in de beginscherm-app)
function b64url(buf){ var s = '', b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function startVerbinden(){
  var arr = new Uint8Array(48); crypto.getRandomValues(arr);
  var verifier = b64url(arr.buffer).slice(0, 64);
  auth.verifier = verifier; lsSet(AUTH_KEY, auth);
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(function(h){
    return 'https://www.dropbox.com/oauth2/authorize?client_id=' + encodeURIComponent(appKey()) + '&response_type=code&token_access_type=offline' +
      '&code_challenge_method=S256&code_challenge=' + b64url(h);
  });
}
function rondVerbindenAf(code){
  var body = 'grant_type=authorization_code&code=' + encodeURIComponent(code.trim()) + '&client_id=' + encodeURIComponent(appKey()) + '&code_verifier=' + encodeURIComponent(auth.verifier || '');
  return fetch('https://api.dropboxapi.com/oauth2/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
    .then(function(r){ return r.json().then(function(d){
      if (!r.ok) throw new Error(d.error_description || d.error || 'Verbinden mislukt');
      auth.refresh = d.refresh_token; auth.access = d.access_token; auth.exp = Date.now() + (d.expires_in || 14400) * 1000; delete auth.verifier;
      lsSet(AUTH_KEY, auth);
      return rpc('users/get_current_account', null).then(function(acc){ auth.naam = acc.name && acc.name.display_name; auth.mail = acc.email; lsSet(AUTH_KEY, auth); }, function(){});
    }); });
}
// eerste keer verbonden op een toestel met eigen nummers, terwijl Dropbox al een bibliotheek heeft: vragen wat te doen
function eersteSync(){
  return rpc('files/list_folder', { path: '' }).then(function(lijst){
    var f = zoekIn(lijst, 'songtool.json');
    if (!f) { meta.dirty = true; return sync(); }
    return haalBestand('/songtool.json').then(function(x){
      var ver = normaliseer(JSON.parse(x)), nVer = Object.keys(ver.songs).length, nLok = Object.keys(db.songs).length;
      if (!nLok) { meta.rev = f.rev; meta.dirty = false; pasToe(ver); return sync(); }
      openVel('Twee bibliotheken', [
        el('p', { tekst: 'In Dropbox staan al ' + nVer + ' nummers, en op dit toestel ' + nLok + '. Wat wil je?' }),
        menuItem('⇄', 'Samenvoegen', 'Aanbevolen. Alles blijft bewaard; staat hetzelfde nummer met een andere tekst op beide, dan krijg je ook een "(kopie)".', function(){
          var samen = voegSamen(db, ver, false); meta.rev = f.rev; meta.dirty = true; pasToe(samen); sync(); }),
        menuItem('☁', 'De Dropbox-versie gebruiken', 'Dit toestel neemt de bibliotheek uit Dropbox over. Eerst wordt een back-up van dit toestel gedownload.', function(){
          download('songtool-dit-toestel-' + vandaag() + '.json', JSON.stringify(exportVorm(db), null, 2), 'application/json');
          meta.rev = f.rev; meta.dirty = false; pasToe(ver); sync(); })]);
    });
  });
}
function toonSync(){
  var inhoud = [];
  if (verbonden()) {
    inhoud.push(el('div', { klasse: 'melding' + (syncFout ? ' fout' : '') }, [
      el('b', { tekst: syncFout ? 'Probleem met synchroniseren' : 'Live verbonden met Dropbox' }), el('br'),
      document.createTextNode((auth.naam ? auth.naam + (auth.mail ? ' (' + auth.mail + ')' : '') + '. ' : '') + (syncFout ? syncFout : 'Laatst gesynchroniseerd: ' + wanneer(meta.laatsteSync) + '.'))]));
    inhoud.push(el('p', { klasse: 'zacht klein', tekst: 'Wijzigingen gaan binnen enkele seconden naar Dropbox, en je andere toestellen halen ze op zolang de Songtool open staat. Zonder internet werk je gewoon verder: alles wordt later bijgewerkt. Je bibliotheek staat in Dropbox › Apps › Songtool › songtool.json, met elke dag een back-up.' }));
    inhoud.push(el('div', { klasse: 'knoppen' }, [
      el('button', { klasse: 'primair', tekst: 'Nu synchroniseren', onclick: function(){ sync().then(function(){ sluitVel(); toast(syncFout ? 'Mislukt: ' + syncFout : 'Gesynchroniseerd'); }); } }),
      el('button', { tekst: 'Loskoppelen', onclick: function(){ if (confirm('Dit toestel loskoppelen van Dropbox? Je nummers blijven op dit toestel staan.')) { auth = { appKey: auth.appKey }; lsSet(AUTH_KEY, auth); meta.rev = null; bewaarMeta(); zetDot(''); sluitVel(); } } })]));
  } else {
    var sleutel = el('input', { type: 'text', placeholder: 'App key van je Dropbox-app', value: appKey(), autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
    var code = el('input', { type: 'text', placeholder: 'Plak hier de code van Dropbox', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false' });
    var info = el('p', { klasse: 'zacht klein' });
    inhoud.push(el('p', { tekst: 'Verbind met Dropbox, dan is je bibliotheek live hetzelfde op je iPhone, iPad en laptop, en ziet de Songtool wat de Studio met je opnames doet.' }));
    if (!DROPBOX_APP_KEY) inhoud.push(el('label', { klasse: 'veld' }, [el('span', { tekst: 'App key' }), sleutel]));
    inhoud.push(el('div', { klasse: 'knoppen' }, [el('button', { klasse: 'primair', tekst: '1. Geef toegang in Dropbox', onclick: function(){
      if (!DROPBOX_APP_KEY) { auth.appKey = sleutel.value.trim(); lsSet(AUTH_KEY, auth); }
      if (!appKey()) { info.textContent = 'Vul eerst de app key in.'; return; }
      var w = window.open('about:blank', '_blank');
      startVerbinden().then(function(url){ if (w) w.location.href = url; else location.href = url; info.textContent = 'Tik in Dropbox op "Toestaan", kopieer de code en kom terug naar dit scherm.'; });
    } })]));
    inhoud.push(el('label', { klasse: 'veld', style: 'margin-top:14px' }, [el('span', { tekst: '2. Plak de code' }), code]));
    inhoud.push(el('div', { klasse: 'knoppen' }, [el('button', { klasse: 'primair', tekst: 'Verbinden', onclick: function(){
      if (!code.value.trim()) { info.textContent = 'Plak eerst de code uit Dropbox.'; return; }
      info.textContent = 'Verbinden…';
      rondVerbindenAf(code.value).then(function(){ sluitVel(); toast('Verbonden met Dropbox'); return eersteSync(); })
        .catch(function(e){ info.textContent = 'Lukt niet: ' + e.message + '. Probeer stap 1 opnieuw (een code is maar één keer bruikbaar).'; });
    } })]));
    inhoud.push(info);
  }
  openVel('Synchronisatie', inhoud);
}

// ---------- Studio (opnames, mix, drums, akkoorden uit de opname) ----------
// De Studio op de laptop schrijft studio.json in dezelfde Dropbox-map; de Songtool leest het.
var studio = null;
function studioVersies(s){
  if (!studio || !studio.songs || !s) return [];
  return studio.songs.filter(function(x){ return x.songtool_id === s.id || (!x.songtool_id && (norm(x.titel) === norm(s.title) || norm(x.songtool_titel) === norm(s.title))); })
    .sort(function(a, b){ return String(b.aangemaakt).localeCompare(String(a.aangemaakt)); });
}
var STAPNAAM = { analyse: 'Analyse', drums: 'Drums', mix: 'Mix', tekst: 'Tekst', export: 'Export' };
function stapChips(x){
  return el('div', { klasse: 'statuschips' }, Object.keys(STAPNAAM).map(function(k){
    var v = (x.stappen || {})[k] || 'open';
    return el('span', { klasse: 'sc ' + v, tekst: ({ klaar: '✓ ', oud: '• ', uit: '– ', open: '○ ' }[v] || '') + STAPNAAM[k] });
  }));
}
function studioLink(x){ return studio.lan_url ? studio.lan_url + '/#/song/' + x.id : null; }
function toonStudio(){
  var s = huidig(), vs = studioVersies(s);
  if (!vs.length) { toonStudioOverzicht(); return; }
  var inhoud = [el('p', { klasse: 'zacht klein', tekst: 'Wat de Studio op de laptop met je opnames deed. Bijgewerkt ' + wanneer(studio.bijgewerkt_ms) + '.' })];
  vs.forEach(function(x, i){
    var blok = el('div', { klasse: 'studio-versie' });
    blok.appendChild(el('h3', { tekst: x.titel + (vs.length > 1 ? (i === 0 ? ' · nieuwste opname' : ' · ' + String(x.aangemaakt).slice(0, 10)) : '') }));
    blok.appendChild(el('div', { klasse: 'zacht klein', tekst: [x.tempo ? x.tempo + ' BPM' : null, x.maatsoort, x.toonaard, x.duur ? Math.floor(x.duur / 60) + ':' + ('0' + Math.floor(x.duur % 60)).slice(-2) : null].filter(Boolean).join(' · ') }));
    blok.appendChild(stapChips(x));
    if (x.status && x.status.bezig) blok.appendChild(el('div', { klasse: 'melding', tekst: 'Bezig: ' + x.status.stap }));
    // tempo en toonaard overnemen
    var bpm = x.tempo ? String(Math.round(x.tempo)) : '', key = x.toonaard_kort || '';
    if ((bpm && bpm !== String(s.bpm || '')) || (key && key !== (s.key || ''))) {
      blok.appendChild(el('button', { tekst: 'Neem ' + [bpm ? bpm + ' BPM' : null, key || null].filter(Boolean).join(' en ') + ' over', onclick: function(){
        if (bpm) s.bpm = bpm; if (key) s.key = key; s.updated = stempel(s.updated); gewijzigd(); toonKop(); sluitVel(); toast('Overgenomen');
      } }));
    }
    // akkoordenblad uit de opname
    if (x.blad) {
      var mini = el('div', { klasse: 'mini-blad verborgen', html: bladHtml({ title: x.titel, key: key, bpm: bpm, lyrics: x.blad }, 0) });
      blok.appendChild(el('div', { klasse: 'knoppen' }, [
        el('button', { tekst: 'Akkoorden uit de opname bekijken', onclick: function(){ mini.classList.toggle('verborgen'); } }),
        el('button', { tekst: 'Gebruik als tekst', onclick: function(){
          if (!confirm('Je tekst vervangen door het blad uit de opname (' + (x.blad_bron === 'songtool' ? 'jouw woorden met de akkoorden die in de opname gespeeld worden' : 'herkende tekst en akkoorden') + ')? Je huidige tekst blijft bewaard bij "Vorige versie".')) return;
          zetTekst(s, x.blad, 'akkoorden uit de opname'); sluitVel(); toast('Tekst vervangen (vorige versie bewaard)'); } })]));
      blok.appendChild(mini);
    }
    // masters beluisteren
    (x.exports || []).forEach(function(ex){
      if (!ex.mp3) return;
      var speler = el('div');
      blok.appendChild(el('div', { klasse: 'knoppen' }, [el('button', { tekst: '▶ ' + ex.naam + (ex.gemaakt ? ' · ' + String(ex.gemaakt).slice(0, 10) : ''), onclick: function(){
        speler.innerHTML = '<p class="zacht klein">Laden…</p>';
        rpc('files/get_temporary_link', { path: ex.mp3 }).then(function(d){
          speler.innerHTML = ''; var a = el('audio', { controls: 'controls', src: d.link, preload: 'auto' }); speler.appendChild(a); a.play();
        }, function(e){ speler.innerHTML = ''; speler.appendChild(el('p', { klasse: 'zacht klein', tekst: 'Afspelen lukt niet (' + e.message.slice(0, 80) + '). Staat de export al in Dropbox?' })); });
      } })]));
      blok.appendChild(speler);
    });
    if (!(x.exports || []).some(function(e){ return e.mp3; })) blok.appendChild(el('p', { klasse: 'zacht klein', tekst: 'Nog geen export: maak er een in de Studio (Exporteren, met "Ook in Dropbox"), dan kun je hier luisteren, ook buitenshuis.' }));
    var link = studioLink(x);
    if (link) blok.appendChild(el('div', { klasse: 'knoppen' }, [el('a', { href: link, target: '_blank', rel: 'noopener', klasse: 'zacht klein', tekst: 'Open in de Studio ↗ (thuis, als de laptop aan staat)' })]));
    inhoud.push(blok);
  });
  openVel('Studio · ' + (s.title || ''), inhoud);
}
function toonStudioOverzicht(){
  if (!studio || !studio.songs) {
    openVel('Studio', [el('p', { tekst: verbonden() ? 'Nog geen gegevens van de Studio. Staat de laptop aan en draait Songtool Studio?' : 'Verbind eerst met Dropbox (Menu › Synchronisatie): daarlangs vertelt de Studio op de laptop wat er met je opnames gebeurt.' }),
      el('p', { klasse: 'zacht klein', tekst: 'Nieuwe opname? Zet je GarageBand-project in Dropbox › Apps › Songtool › Studio › Nieuwe opnames (Bestanden-app: lang indrukken › Kopieer › Plak). De laptop pakt het vanzelf op.' })]);
    return;
  }
  var inhoud = [el('p', { klasse: 'zacht klein', tekst: 'Nieuwe opname: zet je GarageBand-project in Dropbox › Apps › Songtool › Studio › Nieuwe opnames. Bijgewerkt ' + wanneer(studio.bijgewerkt_ms) + '.' })];
  studio.songs.slice().sort(function(a, b){ return String(b.aangemaakt).localeCompare(String(a.aangemaakt)); }).forEach(function(x){
    var s = null; Object.keys(db.songs).forEach(function(id){ if (!s && studioVersies(db.songs[id]).indexOf(x) >= 0) s = db.songs[id]; });
    inhoud.push(el('div', { klasse: 'studio-versie' }, [
      el('h3', { tekst: x.titel }), el('div', { klasse: 'zacht klein', tekst: (s ? 'Nummer: ' + s.title : 'Nog niet in je bibliotheek') + ' · ' + String(x.aangemaakt).slice(0, 10) }),
      stapChips(x),
      el('div', { klasse: 'knoppen' }, [
        s ? el('button', { tekst: 'Open nummer', onclick: function(){ sluitVel(); openSong(s.id); setTimeout(toonStudio, 250); } })
          : el('button', { tekst: 'Maak er een nummer van', onclick: function(){
              sluitVel(); nieuwSong(null, { title: x.titel, key: x.toonaard_kort || '', bpm: x.tempo ? String(Math.round(x.tempo)) : '', lyrics: x.blad || '' }); toast('Nummer aangemaakt'); } }),
        studioLink(x) ? el('a', { href: studioLink(x), target: '_blank', rel: 'noopener', klasse: 'zacht klein', style: 'align-self:center', tekst: 'Studio ↗' }) : null])]));
  });
  openVel('Studio', inhoud);
}

// ---------- scherm passend houden (iOS-toetsenbord) ----------
function pasAan(){
  var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
  $('app').style.top = (vv ? vv.offsetTop : 0) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', pasAan); visualViewport.addEventListener('scroll', pasAan); }
window.addEventListener('resize', pasAan);
window.addEventListener('hashchange', function(){ var m = location.hash.match(/song=([\w\-]+)/); if (m && m[1] !== huidigId && db.songs[m[1]]) openSong(m[1]); });

// ---------- start ----------
db = laadDb();
meta = lsGet(META_KEY, {});
auth = lsGet(AUTH_KEY, {});
ui = lsGet(UI_KEY, {});
studio = lsGet(STUDIO_KEY, null);
memoInfo = lsGet(MEMO_KEY, null);
if (ui.vastLib !== false && window.matchMedia('(min-width: 1000px)').matches) { document.body.classList.add('vast-lib'); $('lib').classList.add('open'); }
pasAan();
(function(){
  var m = location.hash.match(/song=([\w\-]+)/);
  var start = (m && db.songs[m[1]]) ? m[1] : (db.songs[ui.laatste] ? ui.laatste : eersteSong());
  modus = 'bewerk';
  openSong(start);
  zetDot(verbonden() ? 'bezig' : '', null);
  if (m && !db.songs[m[1]] && verbonden()) { sync().then(function(){ if (db.songs[m[1]]) openSong(m[1]); }); } else sync();
})();
</script>
