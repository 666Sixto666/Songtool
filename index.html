function bTijdTekst(o){
  var t = bAudio ? bAudio.currentTime : 0, m = bMaatVanTijd(o, t);
  return duurTekst(t) + (m >= 1 ? ' · maat ' + m : ' · intel');
}
function bLaad(o, bron){
  var pad = '/' + o.audio[bron], sleutel = pad + '@' + (o.gemaakt || '');
  return idbDoe('readonly', function(st){ return st.get(sleutel); }, 'audio').catch(function(){ return null; }).then(function(b){
    if (b) return b;
    $('btijd').textContent = 'Laden… (de eerste keer, daarna ook offline)';
    return deelBestand(bdb.link, pad, true).then(function(blob){
      idbDoe('readwrite', function(st){ return st.put(blob, sleutel); }, 'audio').catch(function(){});
      return blob;
    });
  });
}
function bWissel(o, bron){
  var t = bAudio ? bAudio.currentTime : null, speelde = bAudio && !bAudio.paused;
  bBron = bron;
  if (!bAudio) { bSpelerToon(o); return; }
  bAudio.pause();
  bLaad(o, bron).then(function(blob){
    var a = new Audio(URL.createObjectURL(blob)); bZetAudio(a, o);
    a.addEventListener('loadedmetadata', function(){ a.currentTime = t || 0; if (speelde) a.play(); }, { once: true });
    bSpelerToon(o);
  }).catch(function(e){ toast('Laden lukt niet: ' + scopeFout(e)); });
}
function bZetAudio(a, o){
  bAudio = a; a.playbackRate = bSnel; a.preservesPitch = true; a.webkitPreservesPitch = true;
  a.addEventListener('play', function(){ bLoop(o); bKnop(); });
  a.addEventListener('pause', bKnop); a.addEventListener('ended', bKnop);
  // herhalen ook als het scherm niet ververst (vergrendeld, achtergrond): de audio zelf meldt de tijd
  a.addEventListener('timeupdate', function(){ if (bLus && a.currentTime >= bLus.b) a.currentTime = bLus.a; });
}
function bKnop(){ var k = document.querySelector('#bspeler .speel'); if (k) k.textContent = bAudio && !bAudio.paused ? '❚❚' : '▶'; }
function bSpeel(o, vanaf){
  if (bAudio) { if (vanaf != null) bAudio.currentTime = vanaf; if (bAudio.paused || vanaf != null) bAudio.play(); else bAudio.pause(); return; }
  bLaad(o, bBron).then(function(blob){
    var a = new Audio(URL.createObjectURL(blob)); bZetAudio(a, o);
    a.addEventListener('loadedmetadata', function(){ if (vanaf != null) a.currentTime = vanaf; a.play(); }, { once: true });
  }).catch(function(e){ toast('Laden lukt niet: ' + scopeFout(e)); });
}
function bSpring(maat){ var o = bOpn(bHuidig); if (!o) return; if (bLus) bLus = null; bSpeel(o, Math.max(0, bTijdVanMaat(o, maat) - 0.05)); bSpelerToon(o); }
function bHerhaal(o){
  if (bLus) { bLus = null; bSpelerToon(o); return; }
  var m = bAudio ? bMaatVanTijd(o, bAudio.currentTime) : 1;
  var x = (o.secties || []).filter(function(y){ return y.start <= m && m <= y.eind; })[0] || (o.secties || [])[0];
  if (!x) return;
  bLus = { start: x.start, eind: x.eind, a: bTijdVanMaat(o, x.start), b: bTijdVanMaat(o, x.eind + 1) };
  if (!bAudio || bAudio.currentTime < bLus.a || bAudio.currentTime > bLus.b) bSpeel(o, bLus.a);
  bSpelerToon(o); toast('Herhaal ' + x.naam + ' (maat ' + x.start + '–' + x.eind + ')');
}
function bLoop(o){
  cancelAnimationFrame(bRaf);
  var vorige = 0;
  (function stap(){
    if (!bAudio || bAudio.paused) return;
    var t = bAudio.currentTime;
    if (bLus && t >= bLus.b) bAudio.currentTime = bLus.a;
    var tt = $('btijd'); if (tt) tt.textContent = bTijdTekst(o);
    var m = bMaatVanTijd(o, t);
    if (m !== vorige && bWeergave === 'maten') {
      var oud = weergave.querySelector('.maat.nu'); if (oud) oud.classList.remove('nu');
      var c = weergave.querySelector('.maat[data-maat="' + m + '"]');
      if (c) { c.classList.add('nu'); var r = c.getBoundingClientRect(), w = weergave.getBoundingClientRect(); if (r.top < w.top || r.bottom > w.bottom) c.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      vorige = m;
    }
    bRaf = requestAnimationFrame(stap);
  })();
}

// opnames van het bandlid (eigen map; delen met Tom via Gedeeld/)
function bandMemoBewaar(blob, mime, duur){
  var id = genId('memo'), ext = extVoor(mime), pad = '/memos/' + id + '.' + ext, s = bSongs()[bHuidig];
  return memoBewaar(id, { blob: blob, type: mime, geupload: false, pad: pad }).then(function(){
    bdb.memos.unshift({ id: id, created: Date.now(), updated: Date.now(), duur: Math.round(duur * 10) / 10, pad: pad, ext: ext, type: mime,
                        songId: bHuidig, songTitel: s ? s.title : '', gedeeld: false, notitie: '' });
    bWijzig(); toast('Opname bewaard'); mijnOpnames();
  });
}
function mijnOpnames(){
  var lijst = bdb.memos.filter(function(x){ return !bdb.deleted[x.id]; });
  openVel('Mijn opnames', [
    el('div', { klasse: 'knoppen', style: 'margin:0 0 10px' }, [el('button', { klasse: 'primair', tekst: '🎙 Nieuwe opname', onclick: function(){ sluitVel(); opnemen(null); } })]),
    lijst.length ? null : el('p', { klasse: 'zacht', tekst: 'Nog geen opnames.' })].concat(lijst.map(function(x){
    var speler = el('div');
    return el('div', { klasse: 'frag' }, [
      el('div', { klasse: 'zacht klein', tekst: (x.songTitel || 'Los idee') + ' · ' + wanneer(x.created) + ' · ' + duurTekst(x.duur) + (x.gedeeld ? ' · gedeeld met Tom' : '') }),
      x.notitie ? el('div', { klasse: 'tx', tekst: x.notitie }) : null,
      el('div', { klasse: 'ac' }, [
        el('button', { tekst: '▶', onclick: function(){ speelMemo({ id: x.id, memo: { pad: x.pad } }, speler); } }),
        el('button', { klasse: x.gedeeld ? 'aan-gedeeld' : '', tekst: x.gedeeld ? '✓ Gedeeld met Tom' : 'Deel met Tom', onclick: function(){
          if (!x.gedeeld && !bdb.naam) { var n = prompt('Je naam (zo ziet Tom van wie het komt):', ''); if (!n || !n.trim()) return; bdb.naam = n.trim(); }
          x.gedeeld = !x.gedeeld; x.updated = Date.now(); bWijzig(); mijnOpnames();
          if (x.gedeeld && !bdb.tomWeet) toast('Gedeeld. Stuur Tom één keer je deel-link: ⋯ › Delen met Tom');
        } }),
        el('button', { tekst: '✎', onclick: function(){ var t = prompt('Notitie bij deze opname:', x.notitie || ''); if (t !== null) { x.notitie = t.trim(); x.updated = Date.now(); bWijzig(); mijnOpnames(); } } }),
        el('button', { klasse: 'gevaar', tekst: '🗑', onclick: function(){ if (confirm('Deze opname uit je lijst halen?')) { bdb.deleted[x.id] = Date.now(); x.gedeeld = false; x.updated = Date.now(); bWijzig(); mijnOpnames(); } } })]),
      speler]);
  })));
}
function bandMenu(){
  openVel('Menu', [
    menuItem('🎙', 'Mijn opnames', bdb.memos.length ? bdb.memos.length + ' opname(s)' : 'Neem een idee op', mijnOpnames),
    menuItem('↗', 'Delen met Tom', 'Stuur Tom één keer deze link: dan ziet hij wat jij deelt', function(){
      if (!verbonden()) { toonSync(); return; }
      if (!bdb.naam) { var n = prompt('Je naam (zo ziet Tom van wie het komt):', ''); if (!n || !n.trim()) return; bdb.naam = n.trim(); bWijzig(); }
      schrijfGedeeld(true).then(function(){ return maakDeelLink('/Gedeeld'); }).then(function(link){
        bdb.tomWeet = true; bWijzig();
        deel('Songtool – ' + bdb.naam, 'Open dit in je Songtool om te zien wat ik deel:', basisUrl() + '#bandlid=' + encodeURIComponent(link) + '&naam=' + encodeURIComponent(bdb.naam));
      }).catch(function(e){ alert(scopeFout(e)); });
    }),
    menuItem('🖨', 'Afdrukken / PDF', 'Dit nummer', function(){ var s = bSongs()[bHuidig]; if (s) drukAf([s]); }),
    menuItem('☁', 'Synchronisatie', syncUitleg(), toonSync),
    menuItem('?', 'Hulp', null, function(){ openVel('Hulp', [el('div', { klasse: 'help', html:
      '<p><b>Blad</b>: tekst en akkoorden van Tom (je kan niets wijzigen; transponeren en "Passend" gelden enkel voor jou).</p>' +
      '<p><b>Maten</b>: de akkoorden per maat, per sectie. Tik op een maat om daar te beginnen spelen.</p>' +
      '<p><b>Meespelen</b>: kies "Zonder bas" om mee te spelen of "Bas alleen" om te leren; tik op een sectie om ernaartoe te springen, 🔁 herhaalt de sectie, 85% / 75% is trager zonder dat de toonhoogte verandert. Wat je één keer beluisterde, werkt daarna ook offline.</p>' +
      '<p><b>🎛 Sound & notitie</b>: per nummer je sound (versterker, pedalen, instellingen) en een notitie; ze staan bovenaan het nummer.</p>' +
      '<p><b>✎ Runs</b>: zet de knop aan en tik op een regel (Blad) of een maat (Maten) om er een run of aanwijzing bij te noteren.</p>' +
      '<p>Notities, runs en <b>opnames</b> zijn van jou, op al je toestellen. Een opname deel je met Tom met "Deel met Tom".</p>' })]); })]);
}
function schrijfGedeeld(altijd){
  var items = bdb.memos.filter(function(x){ return x.gedeeld && !bdb.deleted[x.id]; });
  var inh = { app: 'Songtool', naam: bdb.naam || 'Bandlid', items: items.map(function(x){
    return { id: x.id, songId: x.songId, songTitel: x.songTitel, created: x.created, gedeeld: x.updated, duur: x.duur, notitie: x.notitie, bestand: x.id + '.' + x.ext };
  }) };
  var h = hash(JSON.stringify(inh));
  bmeta.gekopieerd = bmeta.gekopieerd || {};
  var keten = Promise.resolve();
  items.forEach(function(x){
    if (bmeta.gekopieerd[x.id]) return;
    keten = keten.then(function(){ return rpc('files/copy_v2', { from_path: x.pad, to_path: '/Gedeeld/' + x.id + '.' + x.ext, autorename: false }); })
      .then(function(){ bmeta.gekopieerd[x.id] = 1; }, function(e){ if (e.status === 409 && /to\/conflict/.test(e.message)) bmeta.gekopieerd[x.id] = 1; else throw e; });
  });
  Object.keys(bmeta.gekopieerd).forEach(function(id){
    if (items.some(function(x){ return x.id === id; })) return;
    var x = bdb.memos.filter(function(y){ return y.id === id; })[0];
    keten = keten.then(function(){ return rpc('files/delete_v2', { path: '/Gedeeld/' + id + '.' + (x ? x.ext : 'm4a') }).catch(function(){}); })
      .then(function(){ delete bmeta.gekopieerd[id]; });
  });
  return keten.then(function(){
    if (!altijd && h === bmeta.gedeeldHash) return;
    return zetBestand('/Gedeeld/gedeeld.json', JSON.stringify(inh), { '.tag': 'overwrite' }).then(function(){ bmeta.gedeeldHash = h; lsSet(BMETA_KEY, bmeta); });
  });
}
function bVoegSamen(a, b){
  var uit = { notities: {}, memos: [], deleted: {}, naam: a.naam || b.naam, link: (a.linkTijd || 0) >= (b.linkTijd || 0) ? (a.link || b.link) : (b.link || a.link),
              linkTijd: Math.max(a.linkTijd || 0, b.linkTijd || 0), tomWeet: a.tomWeet || b.tomWeet };
  Object.keys(a.notities || {}).concat(Object.keys(b.notities || {})).forEach(function(k){
    var x = (a.notities || {})[k], y = (b.notities || {})[k];
    uit.notities[k] = !x ? y : (!y ? x : ((x.updated || 0) >= (y.updated || 0) ? x : y));
  });
  Object.keys(a.deleted || {}).concat(Object.keys(b.deleted || {})).forEach(function(k){ uit.deleted[k] = Math.max((a.deleted || {})[k] || 0, (b.deleted || {})[k] || 0); });
  uit.runs = {};
  Object.keys(a.runs || {}).concat(Object.keys(b.runs || {})).forEach(function(song){
    var x = (a.runs || {})[song] || {}, y = (b.runs || {})[song] || {}, r = uit.runs[song] = {};
    Object.keys(x).concat(Object.keys(y)).forEach(function(k){ r[k] = !x[k] ? y[k] : (!y[k] ? x[k] : ((x[k].updated || 0) >= (y[k].updated || 0) ? x[k] : y[k])); });
  });
  var mm = {};
  (a.memos || []).concat(b.memos || []).forEach(function(x){ if (!mm[x.id] || (x.updated || 0) > (mm[x.id].updated || 0)) mm[x.id] = x; });
  uit.memos = Object.keys(mm).map(function(k){ return mm[k]; }).sort(function(x, y){ return y.created - x.created; });
  return uit;
}
function bandSync(){
  if (!verbonden() || !navigator.onLine) { zetDot(verbonden() ? 'bezig' : '', verbonden() ? 'Offline' : null); return Promise.resolve(); }
  if (bSyncBezig) return Promise.resolve();
  bSyncBezig = true; zetDot('bezig', 'Synchroniseren…');
  var poging = 0;
  function eigen(){
    poging++;
    return rpc('files/list_folder', { path: '' }).then(function(lijst){
      var f = zoekIn(lijst, 'bandlid.json');
      var stap = Promise.resolve();
      if (f && f.rev !== bmeta.rev) stap = haalBestand('/bandlid.json').then(function(x){
        var ver = JSON.parse(x), samen = bVoegSamen(bdb, ver), was = JSON.stringify(bdb);
        if (JSON.stringify(samen) !== was) { bdb = samen; lsSet(BDB_KEY, bdb); bToon(); }
        bmeta.rev = f.rev;
        if (JSON.stringify(samen) !== JSON.stringify(bVoegSamen(ver, ver))) { bmeta.dirty = true; bmeta.seq = (bmeta.seq || 0) + 1; }
      });
      return stap.then(function(){
        if (f && !bmeta.dirty) return;
        var seq = bmeta.seq;
        return zetBestand('/bandlid.json', JSON.stringify(bdb), f ? { '.tag': 'update', update: f.rev } : { '.tag': 'add' }).then(function(r){
          bmeta.rev = r.rev; if (bmeta.seq === seq) bmeta.dirty = false;
        }, function(e){ if (e.status === 409 && poging < 4) return eigen(); throw e; });
      });
    });
  }
  function vanTom(){
    if (!bdb.link) return Promise.resolve();
    return deelLijst(bdb.link).then(function(lijst){
      var b = zoekIn(lijst, 'band.json'), o = zoekIn(lijst, 'opnames.json'), werk = [];
      var vb = b && (b.rev || b.server_modified), vo = o && (o.rev || o.server_modified);
      if (b && vb !== bstof.vBand) werk.push(deelBestand(bdb.link, '/band.json').then(function(x){ bstof.band = JSON.parse(x); bstof.vBand = vb; }));
      if (o && vo !== bstof.vOpn) werk.push(deelBestand(bdb.link, '/opnames.json').then(function(x){ bstof.opnames = JSON.parse(x); bstof.vOpn = vo; }));
      if (!werk.length) return;
      return Promise.all(werk).then(function(){
        lsSet(BSTOF_KEY, bstof);
        if (!bHuidig || !bSongs()[bHuidig]) bOpen(bEerste());
        else if (!(bAudio && !bAudio.paused)) bToon();        // niet storen terwijl je meespeelt
        if ($('lib').classList.contains('open')) renderBandLib();
      });
    });
  }
  return eigen().then(function(){ return uploadMemos(); }).then(function(){ return schrijfGedeeld(false); }).then(vanTom).then(function(){
    syncFout = null; meta.laatsteSync = Date.now(); zetDot('ok');
  }, function(e){
    syncFout = e.status === 401 ? 'toegang verlopen: verbind opnieuw' : (navigator.onLine ? scopeFout(e) : 'offline');
    zetDot(navigator.onLine ? 'fout' : 'bezig', syncFout);
  }).then(function(){ bSyncBezig = false; lsSet(BMETA_KEY, bmeta); });
}

// ---------- start ----------
db = laadDb();
meta = lsGet(META_KEY, {});
auth = lsGet(AUTH_KEY, {});
ui = lsGet(UI_KEY, {});
studio = lsGet(STUDIO_KEY, null);
memoInfo = lsGet(MEMO_KEY, null);
if (ui.vastLib !== false && window.matchMedia('(min-width: 1000px)').matches) { document.body.classList.add('vast-lib'); $('lib').classList.add('open'); }
pasAan();
if (ROL === 'band') bandStart();
else (function(){
  ontvangBandlid(); toonBandBadge();
  var m = location.hash.match(/song=([\w\-]+)/);
  var start = (m && db.songs[m[1]]) ? m[1] : (db.songs[ui.laatste] ? ui.laatste : eersteSong());
  modus = 'bewerk';
  openSong(start);
  zetDot(verbonden() ? 'bezig' : '', null);
  if (m && !db.songs[m[1]] && verbonden()) { sync().then(function(){ if (db.songs[m[1]]) openSong(m[1]); }); } else sync();
})();
</script>
